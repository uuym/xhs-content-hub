<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>大月月素材库 · XHS Content Studio</title>
<style>
:root{--red:#ff2442;--dark:#1a1a1a;--gray:#888;--border:#eee;--bg:#fafafa}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"PingFang SC","Helvetica Neue",sans-serif;background:var(--bg);color:var(--dark)}
header{background:var(--dark);color:#fff;padding:18px 24px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header .logo{width:38px;height:38px;border-radius:10px;background:var(--red);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px}
header h1{font-size:1.1rem}
header .sub{font-size:.75rem;color:#aaa}
nav{background:#fff;border-bottom:1px solid var(--border);padding:0 24px;display:flex;gap:4px;overflow-x:auto}
nav button{border:none;background:none;padding:13px 16px;font-size:.9rem;cursor:pointer;color:var(--gray);border-bottom:2px solid transparent;white-space:nowrap}
nav button.on{color:var(--red);border-bottom-color:var(--red);font-weight:600}
main{max-width:1100px;margin:0 auto;padding:24px}
.view{display:none}.view.on{display:block}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:24px}
.stat{background:#fff;border:1px solid var(--border);border-radius:12px;padding:16px}
.stat .n{font-size:1.6rem;font-weight:700}.stat .l{font-size:.78rem;color:var(--gray);margin-top:2px}
.sec{font-size:.7rem;letter-spacing:.15em;color:var(--gray);margin:26px 0 4px}
.sec-t{font-size:1.15rem;font-weight:700;margin-bottom:4px}
.sec-d{font-size:.82rem;color:var(--gray);margin-bottom:16px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:16px;cursor:pointer;transition:box-shadow .15s}
.card:hover{box-shadow:0 4px 16px rgba(0,0,0,.08)}
.card .d{font-size:.72rem;color:var(--gray)}
.card h3{font-size:.95rem;margin:6px 0;line-height:1.4}
.card .p{font-size:.8rem;color:#666;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap}
.badge{display:inline-block;font-size:.68rem;padding:2px 8px;border-radius:10px;margin-left:6px}
.b-待发布{background:#fff3e0;color:#e65100}.b-已发布{background:#e8f5e9;color:#2e7d32}.b-已跳过{background:#f5f5f5;color:#999}
.tag{display:inline-block;font-size:.68rem;background:#f0f0f0;border-radius:8px;padding:1px 7px;margin:2px 2px 0 0;color:#666}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;font-size:.82rem}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--border)}
th{background:#f7f7f7;font-size:.75rem;color:var(--gray);font-weight:600}
a{color:var(--red);text-decoration:none}
.batch{background:#fff;border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:18px}
.batch h3{font-size:.95rem;margin-bottom:8px}
.batch .kw{font-size:.78rem;color:var(--gray);margin-bottom:10px}
.logic{background:#fff8f6;border-left:3px solid var(--red);padding:12px 14px;font-size:.82rem;border-radius:0 8px 8px 0;margin-top:12px;line-height:1.7;white-space:pre-wrap}
.filters{margin-bottom:16px;display:flex;gap:8px;flex-wrap:wrap}
.filters button{border:1px solid var(--border);background:#fff;border-radius:16px;padding:5px 14px;font-size:.8rem;cursor:pointer}
.filters button.on{background:var(--red);color:#fff;border-color:var(--red)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal-bg.on{display:flex}
.modal{background:#fff;border-radius:16px;max-width:640px;width:100%;max-height:85vh;overflow-y:auto;padding:28px}
.modal h2{font-size:1.1rem;margin-bottom:10px}
.modal .body{font-size:.88rem;line-height:1.8;white-space:pre-wrap;margin:14px 0}
.modal .imgs img{max-width:100%;border-radius:8px;margin:6px 0}
.modal .meta{font-size:.78rem;color:var(--gray);border-top:1px solid var(--border);padding-top:12px;margin-top:12px}
.modal .close{float:right;border:none;background:#f0f0f0;border-radius:8px;padding:6px 14px;cursor:pointer}
footer{text-align:center;color:#bbb;font-size:.72rem;padding:30px}
@media(max-width:600px){main{padding:14px}}
</style>
</head>

scovery/item/6abd26d1000000000b006631?app_platform=ios&app_version=9.32.3&share_from_user_hidden=true&xsec_source=app_share&type=normal&xsec_token=CBHnbQsfOQPZ1Y3EdvC8xbCP_muZpcSug_G4B9iDdejLo=&author_share=1", "contentType": "manual", "body": "圣母百花教堂⛪主教堂+地宫（在一栋楼）下午16:30问工作人员是否可以买票，回复可以但关门了，哈哈很意大利\n\t\n我们本来买的是16:15时间段，教堂+地宫+钟楼，+洗礼池，总计20€ 3天套票，因为当天才定没有抢到穹顶的🎫，能预约的时间已经19号了，很想看《审判的救赎》壁画至少提前两周订票！\n\t\n好在来得早，提前浏览，也是看到了👀进地宫的时候可爱的工作人员说还有10分钟就关门了，绕着录了一圈视频根本不知道我在哪我在干啥哈哈\n\t\n还好，隔壁的钟楼还开门，爬它400多台阶，不能浪费了这20€\n\t\n还是很壮观，这历时140年修建完成的教堂，神圣庄严很欧洲\n#古典主义建筑[话题]# #佛罗伦萨[话题]# #圣母百花教堂[话题]# #佛罗伦萨一日游[话题]# #佛罗伦萨旅游攻略[话题]# #古典建筑之美[话题]# #大卫雕塑[话题]# #小众国家旅游[话题]# #意大利旅游[话题]# #艺术与建筑[话题]#", "images": [{"url": "https://cdn-image.bj.bcebos.com/uploads/2026/10/02/84df79bd71ca43449d626986d240f63f_720p.webp", "caption": ""}, {"url": "https://cdn-image.bj.bcebos.com/uploads/2026/10/02/6c02bd5f4c3a4bdb9f2517d2ed1ee6f7_720p.webp", "caption": ""}, {"url": "https://cdn-image.bj.bcebos.com/uploads/2026/10/02/2418d57c8e724670b6558d055a8c2f95_720p.webp", "caption": ""}, {"url": "https://cdn-image.bj.bcebos.com/uploads/2026/10/02/c2067aa463eb4d1898153372a4704a86_720p.webp", "caption": ""}, {"url": "https://cdn-image.bj.bcebos.com/uploads/2026/10/02/9280b466e4774531bd9e460f399c7d55_720p.webp", "caption": ""}, {"url": "https://cdn-image.bj.bcebos.com/uploads/2026/10/02/afce935778724d1280fe46d70f54c1f0_720p.webp", "caption": ""}, {"url": "https://cdn-image.bj.bcebos.com/uploads/2026/10/02/dab62bba13834e42b8c824c989fc135b_720p.webp", "caption": ""}], "meta": {"源链接": "https://www.xiaohongshu.com/discovery/item/6abd26d1000000000b006631?app_platform=ios&app_version=9.32.3&share_from_user_hidden=true&xsec_source=app_share&type=normal&xsec_token=CBHnbQsfOQPZ1Y3EdvC8xbCP_muZpcSug_G4B9iDdejLo=&author_share=1", "来源备注": "📌 手动发布 | 赞3 藏1 评0 [https://www.xiaohongshu.com/discovery/item/6abd26d1000000000b006631?app_platform=ios&app_version=9.32.3&share_from_user_hidden=true&xsec_source=app_share&type=normal&xsec_token=CBHnbQsfOQPZ1Y3EdvC8xbCP_muZpcSug_G4B9iDdejLo=&author_share=1]"}}, {"id": "0929", "date": "2026.09.29", "title": "尼斯一天就够了📍跟着来过7次的闺蜜走", "tags": ["尼斯", "南法", "法式生活方式", "尼斯攻略", "城堡山", "地中海", "法国旅游攻略", "我的长长长假"], "status": "已发布", "sourceUrl": "https://www.xiaohongshu.com/discovery/item/6abbbc51000000000b004262?app_platform=ios&app_version=9.32.3&share_from_user_hidden=true&xsec_source=app_share&type=normal&xsec_token=CB5iOSExaZTJeeM4CqNJi_7PCJD1dYAWOIaga810UdLkY=&author_share=1", "contentType": "manual", "body": "南法行程紧？尼斯，芒通，摩纳哥，首选尼斯，其实留一天就够了，我们慢慢逛了很久，每一个必打卡都留念\n我们这次是从法国做高铁，傍晚到了后，一定要选择住在城区市中心，虽然小贵但真的很便利和舒适，分分钟抵达各处\n\t\n✅必去打卡点\n夏加尔博物馆：印象派著作\n尼斯老城：鲜艳的五彩城\n马塞纳广场：喷泉下的艺术表演者\n城堡山：看日落\n英国人漫步大道：1分钟有20个跑者\n蓝椅子：尼斯的蓝\n萨雷亚市场集：下午3点就关门把握时间\n\t\n⛲ 夏加尔博物馆\n馆不大但藏品质量很高，后印象派画作色彩浓烈，亚当夏娃的作品，自己诺亚的故事让我沉迷，每幅画旁边都有二维码可以听各国讲解，门票上印着不同画作， coolest纪念品。周一免费开放，别错过，我们赶上打折8€原价10€。\n\t\n🏘 尼斯老城\n弯弯绕绕的小巷，随便一面墙一扇木门都是中世纪既视感，不用刻意找机位，走到哪拍到哪，色彩斑斓是他的特色，狭长而拥挤，有异国情调但也同时能看到生活尼斯人晒太阳的热爱\n\t\n⚜ 马塞纳广场\n地标打卡点，人会多一些，路过拍一张就够了，不用专门停留。夜晚去的时候看到了吹萨克斯的老人还有行为艺术表演者，这里的广场还有7个行坐者，传闻意味着世界7大洲的人，和平友善大爱\n\t\n🏔 城堡山\n全场最佳，没有之一。爬上去俯瞰整个尼斯湾，红色屋顶+蔚蓝海岸，随便按快门都是壁纸。赶时间其他可以跳，这个必须来。上山路站非常近，也很方便，就是没想到算是中国人哈哈，有需要的小伙伴可以留言，楼主出一篇详细攻略\n\t\n🌊 英国人漫步大道\n从城堡山下来直接到。石子海滩+棕榈树+蓝到不真实的海，不用滤镜。记得带泳衣，这里就是南法人的日常，铁人三项，游泳跑步骑行，这里的海滩是鹅卵石，也是尼斯特色了，夜晚真的很美\n\t\n💙 蓝椅子\n尼斯标志性蓝色长椅，面朝大海。建议下午四点前到，五点以后逆光拍人不好看，但椅子本身怎么拍都出片。\n\t\n🫒 萨雷亚市集\n想逛市集一定要早来！下午三点就开始收摊了。橄榄、鲜花、香料，色彩饱和度拉满，随手拍都是大片。我们并没有去，而是在城区海边赶上了节日的集市也是应有尽有，也是能淘到东西的\n\t\n💡 实用tips：\n穿上舒服的鞋，全程都只需要腿着来，日行一万多步，在找个小店吃点甜品喝喝咖啡，人生绝美只要\n\t\n㊗每一个来南法的人享受当下\n#尼斯[话题]# #南法[话题]# #法式生活方式[话题]# #尼斯攻略[话题]#  #城堡山[话题]# #地中海[话题]# #法国旅游攻略[话题]# #我的长长长假[话题]#", "images": [{"url": "https://cdn-image.bj.bcebos.com/uploads/2026/10/02/7c8503f6bd4a4b708077b2c897f9e179_720p.webp", "caption": ""}, {"url": "https://cdn-image.bj.bcebos.com/uploads/2026/10/02/3251f3a1bd6e48f8a7b3d41e946361ad_720p.webp", "caption": ""}, {"url": "https://cdn-image.bj.bcebos.com/uploads/2026/10/02/0060d1f817d74273b2227853322be3b4_720p.webp", "caption": ""}, {"url": "https://cdn-image.bj.bcebos.com "下班喝点儿", "法国人的浪漫", "法式生活方式", "美酒与美食"], "status": "已发布", "sourceUrl": "https://www.xiaohongshu.com/discovery/item/6ab6d0f3000000000b0044b9?app_platform=ios&app_version=9.32.3&share_from_user_hidden=true&xsec_source=app_share&type=normal&xsec_token=CBVQDDZN-VOdxHYIKMJ8R_iGnjJl-AhIczl9yCSrMu-ps=&author_share=1", "contentType": "manual", "body": "第一次来法国🇫🇷下了飞机五六点看到好多小酒馆都人满为患，原来下班之后，晚饭之前的这段时间，\n是法国人神圣而不可撼动的喝酒时间\n从5，6点起，巴黎街头巷尾的小酒馆就长满了人\n露天terrasse的位置是首选\n和恋人，和好友，和小狗，和自己\n慢悠悠地享受一杯酒\n这就是法式生活不可或缺的L'apéro时光\n爱了巴黎\n#下班之后好好喝酒[话题]# #喝酒氛围感[话题]# #下班喝点儿[话题]# #法国人的浪漫[话题]# #法式生活方式[话题]# #法式生活方式[话题]# #美酒与美食[话题]#", "images": [{"url": "https://cdn-image.bj.bcebos.com/uploads/2026/10/02/b4ddc02195454bcabdb6733dd8217bf2_720p.webp", "caption": ""}], "meta": {"源链接": "https://www.xiaohongshu.com/discovery/item/6ab6d0f3000000000b0044b9?app_platform=ios&app_version=9.32.3&share_from_user_hidden=true&xsec_source=app_share&type=normal&xsec_token=CBVQDDZN-VOdxHYIKMJ8R_iGnjJl-AhIczl9yCSrMu-ps=&author_share=1", "来源备注": "📌 手动发布 | 赞3 藏1 评0 [https://www.xiaohongshu.com/discovery/item/6ab6d0f3000000000b0044b9?app_platform=ios&app_version=9.32.3&share_from_user_hidden=true&xsec_source=app_share&type=normal&xsec_token=CBVQDDZN-VOdxHYIKMJ8R_iGnjJl-AhIczl9yCSrMu-ps=&author_share=1]"}}, {"id": "0925", "date": "2026.09.25", "title": "听说教皇和我同一天到巴黎，求助帖", "tags": ["虽然我很紧张也很局促", "教皇访问巴黎", "走遍全世界", "孤陋寡闻的我", "全世界旅游", "巴黎去哪玩", "巴黎旅游攻略", "谁来管管我", "要用魔法打败魔法", "第一次出国旅行"], "status": "已发布", "sourceUrl": "https://www.xiaohongshu.com/discovery/item/6ab6723b0000000018013234?app_platform=ios&app_version=9.32.3&share_from_user_hidden=true&xsec_source=app_share&type=normal&xsec_token=CBXK39RGk5CX48HpJ6PWycMn3TCaTAUoDmg6FrFn0pMkE=&author_share=1", "contentType": "manual", "body": "第一次区巴黎就有教皇同行，交通管制就算腿着，我还能去哪呢[失望R][失望R][失望R][失望R]酒店和行程都订好了，这就是传说中的欧洲嘛，米兰飞巴黎延误中……巴黎交通还要管制#虽然我很紧张也很局促[话题]# #教皇访问巴黎[话题]# #走遍全世界[话题]# #孤陋寡闻的我[话题]# #全世界旅游[话题]# #巴黎去哪玩[话题]# #巴黎旅游攻略[话题]# #谁来管管我[话题]# #要用魔法打败魔法[话题]# #第一次出国旅行[话题]#", "images": [{"url": "https://cdn-image.bj.bcebos.com/uploads/2026/10/02/38d534fbed8d44f481cfd16a1fab9ef2_720p.webp", "caption": ""}], "meta": {"源链接": "https://www.xiaohongshu.com/discovery/item/6ab6723b0000000018013234?app_platform=ios&app_version=9.32.3&share_from_user_hidden=true&xsec_source=app_share&type=normal&xsec_token=CBXK39RGk5CX48HpJ6PWycMn3TCaTAUoDmg6FrFn0pMkE=&author_share=1", "来源备注": "📌 手动发布 | 赞0 藏0 评8 [https://www.xiaohongshu.com/discovery/item/6ab6723b0000000018013234?app_platform=ios&app_version=9.32.3&share_from_user_hidden=true&xsec_source=app_share&type=normal&xsec_token=CBXK39RGk5CX48HpJ6PWycMn3TCaTAUoDmg6FrFn0pMkE=&author_share=1]"}}, {"id": "0924", "date": "2026.09.24", "title": "米兰 gelato排队王 ciacco（附菜单翻译）", "tags": ["美食SOP指南", "gelato", "意大利gelato", "意大利旅行", "在上海品全球", "一口惊艳的gelato", "意大利菜", "为白人饭发声"], "status": "已发布", "sourceUrl": "https://www.xiaohongshu.com/discovery/item/6ab44be40000000014038e47?app_platform=ios&app_version=9.32.3&share_from_user_hidden=true&xsec_source=app_share&type=normal&xsec_token=CBWfaksUGYA5oyxgvGeUjlR6ImmB731bANJG6cxDx5Dk8=&author_share=1", "contentType": "manual", "body": "闺蜜本地生活，10 年推荐好吃冰淇淋之一！排队很多人，就在大教堂附近\ngelato 价格如 p2-3\n用 gpt 翻译了一下墙上菜单如 p5-8\n闺蜜说他们家是水果风味出圈，每个季节还会更换品类，口感超级绵密一点不像冰激凌，像极了冰镇的果肉奶昔，原汁原味超甜～新品桃子🍑口味，但我最爱的还是嘿嘿～\n\t\n1⃣ 桃子 Pesca 🍑\n超级还原且清新的桃子味  不是香精桃子汽水味\n混有碎碎的桃子果肉  一口一个脆甜大桃子\n吃完感觉心情都美妙了起来～\n2⃣Pistacchio 开心果（🌟🌟🌟最推荐）\n很浓郁很还原的开心果味，没有无花果特别甜，也没有桃子有酸味，是纯正浓厚的坚果味，有点咸，我的最爱😍\n3⃣ FICO：无花果（普利亚产区）\n饱满的无花果颗粒，爱不释手的甜，融化在舌尖回味无穷\n\t\n#美食SOP指南[话题]# #gelato[话题]# #意大利gelato[话题]# #意大利旅行[话题]##在上海品全球[话题]# #一口惊艳的gelato[话题]# #意大利菜[话题]# 全球吃喝小分队 #为白人饭发声[话题]#", "images": [{"url": "https://cdn-image.bj.bcebos.com/uploads/2026/10/02/59aefb9d67154451883c5b754338ca98_720p.webp", "caption": ""}, {"url": "https://cdn-image.bj.bcebos.com/uploads/2026/10/02/81a33078720445258cac8c117bac460c_720p.webp", "caption": ""}, {"url": "https://cdn-image.bj.bcebos.com/uploads/2026/10/02/58fdf0e92501441b9572d1020b42a408_720p.webp", "caption": ""}], "meta": {"源链接": "https://www.xiaohongshu.com/discovery/item/6ab44be40000000014038e47?app_platform=ios&app_version=9.32.3&share_from_user_hidden=true&xsec_source=app_share&type=normal&xsec_token=CBWfaksUGYA5oyxgvGeUjlR6ImmB731bANJG6cxDx5Dk8=&author_share=1", "来源备注": "📌 手动发布 | 赞57 藏88 评9 [https://www.xiaohongshu.com/discovery/item/6ab44be40000000014038e47?app_platform=ios&app_version=9.32.3&share_from_user_hidden=true&xsec_source=app_share&type=normal&xsec_token=CBWfaksUGYA5oyxgvGeUjlR6ImmB731bANJG6cxDx5Dk8=&author_share=1]"}}, {"id": "0920", "date": "2026.09.20", "title": "上海盲盒酒局「活人感」拉满🍷i人友好", "tags": ["我的小酒馆日记", "盲盒酒局", "tableforsix", "上海交友", "i人社交", "上海线下活动", "沪漂日常", "活人感"], "status": "已发布", "sourceUrl": "https://www.xiaohongshu.com/discovery/item/6aaf59d3000000000d027bd8?app_platform=ios&app_version=9.30.1&share_from_user_hidden=true&xsec_source=app_share&type=normal&xsec_token=CBZAEfrc5mQ08RqZnbDqdf0vXPko6MGyYhaMGHJsjUCSQ=&author_share=1", "contentType": "manual", "body": "周六去参加Table for Six盲盒酒局，超开心。市中心一家暖光bar，六个陌生人被AI 算法推荐到一桌，畅聊了两个多小时，散场路上和朋友感慨好久没有这种活人感了～余温无法散去，回味无穷\n\t\n🥲我的日常：工作→AI→项目→自我提升→再工作，连“管理生活”都被我做成了系统（做AI的都懂）\n\t\n当我们抽到话题卡“如果有500万你想干嘛”，我以为会听到一堆“逃离现在的人生”。结果没有。大家对自己的生活，居然都有一定程度的满意。\n\t\n那一刻我突然意识到：人觉得自己“还差很多”，但人生的价值感，并不完全来自“我还要再获得什么”。没有一个人对过去的经历表现出后悔。丰富不是经历多，是你回头看的时候，能接受它们已经变成了现在的自己。\n\t\n🥂破冰不尴尬\n虽然是盲盒社交酒局，但T46精心准备了破冰卡片，流程，使得大家很轻松的破冰，喝着小酒进入快乐时光～\n\t\n1⃣ 报名后先填问卷（兴趣、职业、社交偏好） 2⃣ 算法把相对同频的5个人匹配到你这桌 3⃣ 周六晚去小酒馆赴约，桌上有破冰卡牌 4⃣ 跟着卡聊，很多小卡片都是现成话题 5⃣ 散场后，只有互相想继续认识的人，才解锁联系方式\n\t\n对i人友好的三点：不怕坐进不同频的局硬撑、不用自己想话题、不会被当场要微信。\n\t\n👉 如果你是沪漂很久没认识新朋友的人 / 生活被工作填满、缺活人感的人 / 想看看“其他人到底怎么活”的人，快来加入吧，出去玩、认识陌生人、讲自己的故事，本身就是人生～\n\t\n#我的小酒馆日记[话题]# #盲盒酒局[话题]##tableforsix[话题]# #上海交友[话题]##i人社交[话题]##上海线下活动[话题]# #沪漂日常[话题]# #活人感[话题]#", "images": [{"url": "https://cdn-image.bj.bcebos.com/uploads/2026/10/02/eadf4e4aadeb4bcc9c6e4449d4f2e4c5_720p.webp", "caption": ""}, {"url": "https://cdn-image.bj.bcebos.com/uploads/2026/10/02/21763871f3cc4da18450ab481ae516c6_720p.webp", "caption": ""}, {"url": "https://cdn-image.bj.bcebos.com/uploads/2026/10/02/bcf4b6ea81b04d65b33935184efb9564_720p.webp", "caption": ""}, {"url": "https://cdn-image.bj.bcebos.com/uploads/2026/10/02/ed8efdfa4bae406b8c556824464cd132_720p.webp", "caption": ""}, {"url": "https://cdn-image.bj.bcebos.com/uploads/2026/10/02/8dc2301f4b864e749a028d4a20ee00ca_720p.webp", "caption": ""}], "meta": {"源链接": "https://www.xiaohongshu.com/discovery/item/6aaf59d3000000000d027bd8?app_platform=ios&app_version=9.30.1&share_from_user_hidden=true&xsec_source=app_share&type=normal&xsec_token=CBZAEfrc5mQ08RqZnbDqdf0vXPko6MGyYhaMGHJsjUCSQ=&author_share=1", "来源备注": "📌 手动发布 | 赞2 藏0 评0 [https://www.xiaohongshu.com/discovery/item/6aaf59d3000000000d027bd8?app_platform=ios&app_version=9.30.1&share_from_user_hidden=true&xsec_source=app_share&type=normal&xsec_token=CBZAEfrc5mQ08RqZnbDqdf0vXPko6MGyYhaMGHJsjUCSQ=&author_share=1]"}}, {"id": "0908", "date": "2026.09.08", "title": "上海不花钱也开心一整天的4个地方", "tags": ["周末去哪儿", "上海打卡", "周末去哪玩", "小众旅行地", "上海旅行", "上海攻略", "上海周末", "人文景点分享"], "status": "待发布", "sourceUrl": "https://www.xiaohongshu.com/discovery/item/6a3f3c300000000008027e92", "contentType": "12_城市体验", "body": "9月一到，突然有种想学点新东西的冲动。\n翻了翻上海不要钱的好去处，整理了4个能泡一下午的地方——\n\n🥁 想动手试新的\n1元体验课真的香。我在上海花1小时学完缝纫机基础操作，老师很有耐心，全程零推销。架子鼓也有1元课，拿鼓棒敲第一下的感觉太解压了。上海你能想到的手艺，基本都有对应体验课，花1小时试一遍，合不合适立刻知道。\n\n🎨 想看展但不想花钱\n上海免费展的质量超乎想象。上个月去了一个船主题的免费展，讲三个人造船从武汉漂流到上海的经历。布景把整艘船搬进展厅，连他们途中直播用的手机都还在支架上播着，细节拉满。这种水准的展，居然不收门票。\n\n📖 想找个地方安静待着\n图书馆是上海最被低估的福利。上海图书馆东馆本身即是一件建筑作品。徐家汇书院也毫不逊色，外观内饰都值得专程去看。最让我惊喜的是香奈儿图书馆——一面巨大落地窗正对黄浦江，架上全是外面难得一见的美学画册和外文书。找本好看的书，坐一下午，窗外就是江景。\n\n🛋 想泡一天不走\n党群服务中心简直是隐藏宝藏。免费、谁都能进，有热水、插座、沙发，有的甚至带淋浴和健身房。打浦桥和徐汇滨江的都不错，静安蝴蝶湾那家最漂亮，后门直接通苏州河步道，看书看累了出门就是河景。\n\n——\n9月，想学新的、想安静的、想泡一天的，都不用花钱。", "images": [{"url": "./assets/0908/01.jpg", "caption": ""}, {"url": "./assets/0908/02.jpg", "caption": ""}, {"url": "./assets/0908/03.jpg", "caption": ""}, {"url": "./assets/0908/04.jpg", "caption": ""}, {"url": "./assets/0908/05.jpg", "caption": ""}, {"url": "./assets/0908/06.jpg", "caption": ""}, {"url": "./assets/0908/07.jpg", "caption": ""}, {"url": "./assets/0908/08.jpg", "caption": ""}], "meta": {"源链接": "https://www.xiaohongshu.com/discovery/item/6a3f3c300000000008027e92", "来源备注": "📌 源笔记：《并且无门槛、无套路、无推销!》 赞26846 藏15743 评554 [https://www.xiaohongshu.com/discovery/item/6a3f3c300000000008027e92]", "素材包": "./assets/zips/0908.zip（原站资源）"}}, {"id": "0907", "date": "2026.09.07", "title": "9月上海0元快乐指南", "tags": ["上海周末去哪儿", "上海免费景点", "上海Citywalk", "周末去哪玩", "上海生活", "薅羊毛", "不花钱也快乐", "九月你好"], "status": "待发布", "sourceUrl": "", "contentType": "", "body": "9月了，夏天尾巴还在，正好出门薅羊毛。\n整理了4类上海完全不花钱的快乐，亲测无推销无套路👇\n\n📚 先说图书馆\n上海图书馆东馆本身就是个建筑展，徐家汇书院的布局治愈强迫症。最绝的是香奈儿等等图书馆，落地窗外就是黄浦江，美学书籍随便翻，这待遇谁敢信免费？\n\n🎨 免费展不打烊\n上海展览多到看不过来，关键是很多都不收门票。上次在何东旧居看了一个造船漂流展，布景细节拉满，连直播手机都成了展品的一部分，这种质量竟然不要钱。\n\n🥁 1元体验课是真的\n搜过架子鼓、缝纫课，1块钱1小时，老师手把手教，全程零推销。想学什么先花1元试个水，比办卡踩坑强太多。上海基本什么都有体验课，这点真的服。\n\n🏠 党群服务中心被低估了\n打浦桥的、徐汇滨江的、蝴蝶湾的，设施好到离谱——热水插座沙发自习区全免费，有的甚至带淋浴和健身房。蝴蝶湾那个后门直通苏州河步道，学完习出来散个步，完美。\n\n不花钱的周末，在上海反而更快乐。", "images": [{"url": "https://cdn-image.bj.bcebos.com/uploads/2026/09/07/edde30f92d4a4b41b0b76ae52ededa5e.jpg（上海图书馆东馆）", "caption": ""}, {"url": "https://cdn-image.bj.bcebos.com/uploads/2026/09/07/deb04f86290a459398b317df0896f4df.jpg（免费展览空间）", "caption": ""}, {"url": "https://cdn-image.bj.bcebos.com/uploads/2026/09/07/84f7dc1b608f4b8887ba142f5e59dba1.jpg（1元架子鼓体验课）", "caption": ""}, {"url": "https://cdn-image.bj.bcebos.com/uploads/2026/09/07/fb4ef0dcf578478e90794791106f98ad.jpg（党群服务中心）", "caption": ""}], "meta": {"来源备注": "{'title': '并且无门槛、无套路、无推销!', 'url': 'https://www.xiaohongshu.com/discovery/item/6a3f3c300000000008027e92', 'likes': 26836, 'saves': 15735, 'comments': 553}", "素材包": "./assets/zips/0907.zip（原站资源）"}}, {"id": "20260902", "date": "2026.09.02", "title": "上海8个机位，照着拍就出片", "tags": ["上海拍照", "上海Citywalk", "上海周末去哪儿", "上海打卡", "拍照机位", "上海旅行", "出片攻略"], "status": "待发布", "sourceUrl": "", "contentType": "", "body": "9月的光线刚好，整理了8个上海拍照封神点位\n按场景分好了，直接抄作业👇\n\n🌅 江景日落\n❶ 塘桥渡口 — 江边等日落，随手拍都是上海版lalaland\n❷ 陆家嘴日落长廊 — 正对浦西，外滩亮灯那刻绝了\n❸ 北外滩白玉兰广场3F — 三件套无遮挡全景，广角拉满\n\n🏛 复古建筑\n❹ 马勒别墅 — 不用飞北欧就有童话城堡感\n❺ 上海展览中心 — 奶油色俄式外墙，秋天光影绝了\n\n🎨 艺术空间\n❻ 西岸梦中心6号楼 — 极简阶梯，线条感拉满\n❼ 新天地东台里 — 二楼窗口俯瞰街景，城市感天花板\n\n🚇 隐藏彩蛋\n❽ 陆家嘴地铁站6号口 — 扶梯仰拍三件套，路过别错过\n\n💡Tips：\n• ❶❷日落前40分钟到，占好位置\n• ❸周末人多，工作日去更从容\n• ❻❽阴天拍更有线条感\n• 全部免费🆓，0元出片", "images": [{"url": "./assets/0902/01.jpg（塘桥渡口日落）", "caption": ""}, {"url": "./assets/0902/02.jpg（陆家嘴日落长廊）", "caption": ""}, {"url": "./assets/0902/03.jpg（北外滩白玉兰广场3F露台）", "caption": ""}, {"url": "./assets/0902/04.jpg（马勒别墅）", "caption": ""}, {"url": "./assets/0902/05.jpg（上海展览中心）", "caption": ""}, {"url": "./assets/0902/06.jpg（西岸梦中心6号楼）", "caption": ""}, {"url": "./assets/0902/07.jpg（新天地东台里窗口）", "caption": ""}, {"url": "./assets/0902/08.jpg（陆家嘴地铁6号口扶梯）", "caption": ""}], "meta": {"来源备注": "{'title': '以为外滩够美了，直到去了…', 'url': 'https://www.xiaohongshu.com/explore/69e6088f000000001a03260a', 'likes': 5163, 'saves': 3911, 'comments': 53}", "素材包": "./assets/zips/0902.zip（原站资源）"}}, {"id": "0901", "date": "2026.09.01", "title": "上海零成本高质量周末清单", "tags": ["周末去哪儿", "上海打卡", "citywalk", "小众旅行地", "上海旅行", "上海攻略", "人文景点分享", "周末去哪玩"], "status": "待发布", "sourceUrl": "https://www.xiaohongshu.com/discovery/item/6a79da6d000000002403ee55", "contentType": "", "body": "9月了，夏天余温还在，秋天的风已经悄悄来了。\n整理了几个上海不花钱也能逛半天的宝藏地，\n这周末就能安排👇\n\n🌊 滨水散步\n· 乍浦路桥 — 外滩视野C位，人少一半\n· 歇浦路渡口 — 2元轮渡看黄浦江落日\n· 宝山滨江公园 — 江边吹风发呆首选\n\n🌳 公园绿地\n· 世博文化公园 — 市区最大公园，逛半天不够\n· 辅德里公园 — 静安寺旁小众绿地，安静到能听见鸟叫\n· 桂林公园 — 9月桂花季，现在去刚好\n· 世纪公园 — 老牌顶流，秋天散步绝了\n\n🏛 老建筑×文化\n· 华政长宁校区 — 梧桐区百年校园，拍照超出片\n· 宋庆龄故居 — 淮海路老洋房，免费但需预约\n· 交响音乐博物馆 — 宝庆路3号洋房里看展听音乐\n· 邮政博物馆 — 苏州河畔百年邮局，复古感拉满\n\n💡 小tips：\n· 部分场馆需提前预约\n· 9月天气舒服，适合步行+地铁搭配\n· 一天能刷3-4个，慢慢逛更舒服\n\n不花钱的周末，照样可以很高质量✨", "images": [{"url": "./assets/0901/01.jpg", "caption": ""}, {"url": "./assets/0901/02.jpg", "caption": ""}, {"url": "./assets/0901/03.jpg", "caption": ""}, {"url": "./assets/0901/04.jpg", "caption": ""}, {"url": "./assets/0901/05.jpg", "caption": ""}, {"url": "./assets/0901/06.jpg", "caption": ""}, {"url": "./assets/0901/07.jpg", "caption": ""}, {"url": "./assets/0901/08.jpg", "caption": ""}], "meta": {"源链接": "https://www.xiaohongshu.com/discovery/item/6a79da6d000000002403ee55", "来源备注": "📌 源笔记：《分享上海一些低成本高质量体验的地方……》 赞5714 藏6865 评186", "素材包": "./assets/zips/0901.zip（原站资源）"}}, {"id": "0829", "date": "2026.08.29", "title": "北外滩2km夜散步，上海最安静的江景", "tags": ["周末去哪儿", "上海citywalk", "上海夜景", "北外滩", "上海拍照", "小众旅行地", "我的夏日清凉游"], "status": "待发布", "sourceUrl": "https://www.xiaohongshu.com/discovery/item/6a8c15b10000000026039fb5", "contentType": "9_Citywalk", "body": "下班后的北外滩，是上海最治愈的地方。\n没有南京路的人潮，没有外滩的拥挤，只有2公里的江风和满眼灯火。\n\n路线整理好了，慢慢走慢慢看：\n\n🚶起点：12号线国际客运中心站\n出站就是白玉兰广场，抬头就能看到陆家嘴三件套。晚上灯光亮起来的时候，整个天际线像铺开的画卷。\n\n走到The Stage观景台，这里看东方明珠角度绝了。不用挤观景台，江边随便找个栏杆靠着拍，出片率百分百。\n\n继续往前到playground X，灯光设计很巧，暖黄色打在建筑上倒映江面，有点像欧洲河边的夜晚。\n\n北外滩小巨蛋和世界会客厅挨着，晚上人特别少，偶尔有夜跑的人经过。坐在台阶上发会儿呆，听着黄浦江的水声，什么班味都散了。\n\n终点公平路渡口，2块钱坐个轮渡过江，回头再看一眼这片夜景，值了。\n\n全程2公里，走走停停大概一小时。夏天晚上来刚好，江风一吹整个人都松了。", "images": [{"url": "./assets/0829/01.jpg", "caption": ""}, {"url": "./assets/0829/02.jpg", "caption": ""}, {"url": "./assets/0829/03.jpg", "caption": ""}, {"url": "./assets/0829/04.jpg", "caption": ""}, {"url": "./assets/0829/05.jpg", "caption": ""}, {"url": "./assets/0829/06.jpg", "caption": ""}, {"url": "./assets/0829/07.jpg", "caption": ""}, {"url": "./assets/0829/08.jpg", "caption": ""}], "meta": {"源链接": "https://www.xiaohongshu.com/discovery/item/6a8c15b10000000026039fb5", "来源备注": "📌 源笔记：《本人在沪招待外地朋友已有SOP（夜晚散步版）》 赞4741 藏6574 评201 [https://www.xiaohongshu.com/discovery/item/6a8c15b10000000026039fb5]", "素材包": "./zips/0829.zip（原站资源）"}}, {"id": "0828", "date": "2026.08.28", "title": "38度上海，6个免费吹空调宝地", "tags": ["上海免费景点", "上海避暑", "上海周末去哪儿", "上海Citywalk", "上海室内逛", "上海老建筑", "上海夏天", "城市漫游"], "status": "待发布", "sourceUrl": "", "contentType": "", "body": "上海8月底，室外38度，室内空调20度。\n整理了6个不花钱就能待一下午的地方，\n按\"你想待多久\"分了类——\n.\n⏱ 打卡就走\n🏛 证券博物馆\n远东第一交易所旧址。水晶吊灯一层比一层夸张，随便拍两张就是复古大片，不用滤镜。\n.\n📖 半小时到一小时\n📖 夏衍旧居\n普通老洋房的外观，里面每间屋子都有故事。卧室那台打字机按键光亮得像有人刚放下，站在这儿会有种穿越感。\n📚 香奈儿图书馆\n冲着拍照来的，结果被画册绊住坐了一小时。香奈儿本人的经历比她的设计还上头。\n.\n🛋 半天泡着不走\n🎵 交响音乐博物馆\n老洋房+百年交响乐录音+空调。耳机戴上，窗外绿树红瓦，暑气全消。记得提前预约。\n⛪ 徐家汇书院\n书架上的书像有人替你筛过一遍，盲拿不踩雷。一楼有充电口，拿本书坐下来，外面的高温跟自己没关系了。\n.\n🎁 以为看邮票其实不是\n📮 邮政博物馆\n一楼确实在讲邮政史，但顶楼天台才是真正的彩蛋——苏州河在前，陆家嘴三件套在后。这个角度的上海，花钱也买不到。\n.\n——\n上海在38度的夏天里，\n把凉快的好地方摊开，不收费，不限时。\n热了就躲，待够就走。", "images": [{"url": "https://cdn-image.cdn.bcebos.com/uploads/2026/08/28/66d4cfd793924a6ab3a64d309a5aa1b8.png（交响音乐博物馆老洋房内景）", "caption": ""}, {"url": "https://cdn-image.cdn.bcebos.com/uploads/2026/08/28/2dea7c2ed34d452c9ff46d1c654bffca.png（证券博物馆水晶吊灯）", "caption": ""}, {"url": "https://cdn-image.cdn.bcebos.com/uploads/2026/08/28/4f6ddae81e2b4b2a84abe2111e123b81.png（夏衍旧居打字机）", "caption": ""}, {"url": "https://cdn-image.cdn.bcebos.com/uploads/2026/08/28/50bc6a79299d43f980f2580bfca01931.png（香奈儿图书馆画册）", "caption": ""}, {"url": "https://cdn-image.cdn.bcebos.com/uploads/2026/08/28/48bec7ce8c6c45ee94ba21975bfef2f0.png（徐家汇书院阅读区）", "caption": ""}, {"url": "https://cdn-image.cdn.bcebos.com/uploads/2026/08/28/1dd4d6283f744261a58fa20c1180cd8d.png（邮政博物馆顶楼天台）", "caption": ""}], "meta": {"源笔记": "上海最容易被低估的免费公共资源（空调版）", "源笔记赞": "2515", "源笔记藏": "3382", "源笔记评": "91"}}, {"id": "0827", "date": "2026.08.27", "title": "上海23个博物馆清单｜周末不知道去哪就抄这份", "tags": ["上海博物馆", "周末去哪儿", "上海免费景点", "上海遛娃", "博物馆打卡", "上海攻略", "值得一去的博物馆", "上海周末去哪"], "status": "待发布", "sourceUrl": "https://www.xiaohongshu.com/discovery/item/680e0fdb0000000022027467", "contentType": "", "body": "在上海不知道周末去哪？博物馆真的被严重低估了。\n\n花了两天把上海能逛的博物馆捋了一遍，总共23个，大部分免费，按区域整理好了直接抄。\n\n先说几个tips：\n①大部分周一闭馆，别扑空\n②免费的基本上要提前在小程序预约\n③带小朋友优先自然博物馆、科技馆、天文馆\n④拍照党去邮政博物馆、外滩美术馆，建筑本身就很出片\n\n按类型分了一下，方便你按需选：\n\n【经典必逛】\n上海博物馆、上海历史博物馆、上海自然博物馆、上海天文馆\n这四个是上海博物馆界的顶流，第一次来上海直接选这四个不会踩雷。\n\n【免费白嫖】\n上海博物馆、上海儿童博物馆、上海气象博物馆、上海交响音乐博物馆、上海邮政博物馆、上海消防博物馆、上海无线电博物馆、上海鲁迅纪念馆、上海民生现代美术馆\n注意几个需要单独预约：气象博物馆、交响音乐博物馆，提前在公众号上抢。\n\n【带娃首选】\n上海自然博物馆、上海科技馆、上海天文馆、上海儿童博物馆、上海乐高探索中心\n自然博物馆恐龙化石是镇馆之宝；科技馆有机器人世界和地震体验；天文馆是全球最大的，沉浸感拉满；乐高探索中心适合低龄。\n\n【小众宝藏】\n上海铁路博物馆、上海动漫博物馆、上海气象博物馆、上海地铁博物馆、上海无线电博物馆\n这些冷门但各有特色，铁路博物馆有老蒸汽火车头，地铁博物馆可以模拟驾驶。\n\n【拍照出片】\n上海邮政博物馆、上海外滩美术馆、上海交响音乐博物馆、上海玻璃博物馆\n邮政博物馆复古邮筒+罗马柱大厅，外滩美术馆在历史建筑里看当代艺术，交响音乐博物馆在百年洋房里，玻璃博物馆有热吹表演和光影展。\n\n【票价参考】\n免费9个：上博、儿童馆、气象馆、交响馆、邮政馆、消防馆、无线电馆、鲁迅馆、民生美术馆\n30元档：自然馆、天文馆、航海馆、昆虫馆、地铁馆、动漫馆\n45-60元：科技馆、汽车馆、电影馆\n100+：乐高探索中心\n\n地址和开放时间都在图里了，每张图3个馆， swipe看完整清单。\n\n周末别在家躺了，挑一个出门吧。", "images": [{"url": "./assets/0827/01.jpg（上海博物馆·自然博物馆·天文馆）", "caption": ""}, {"url": "./assets/0827/02.jpg（儿童博物馆·航海博物馆·玻璃博物馆）", "caption": ""}, {"url": "./assets/0827/03.jpg（昆虫博物馆·科技馆·汽车博物馆）", "caption": ""}, {"url": "./assets/0827/04.jpg（电影博物馆·民生美术馆·历史博物馆）", "caption": ""}, {"url": "./assets/0827/05.jpg（铁路博物馆·动漫博物馆·气象博物馆）", "caption": ""}, {"url": "./assets/0827/06.jpg（交响音乐博物馆·邮政博物馆·消防博物馆）", "caption": ""}, {"url": "./assets/0827/07.jpg（乐高探索中心·地铁博物馆·无线电博物馆）", "caption": ""}, {"url": "./assets/0827/08.jpg（鲁迅纪念馆·外滩美术馆）", "caption": ""}], "meta": {"源笔记": "有娃必看！上海值得逛的23个博物馆~", "源链接": "https://www.xiaohongshu.com/discovery/item/680e0fdb0000000022027467", "素材包": "0827.zip（原站资源）", "赞藏评": "赞0 藏0 评0 分享0（2026-08-28 更新）"}}, {"id": "0826b", "date": "2026.08.26", "title": "上海8条路，一个人慢慢走", "tags": ["周末去哪儿", "旅游攻略", "上海打卡", "citywalk", "小众旅行地", "周末去哪玩", "人文景点分享", "上海旅行"], "status": "待发布", "sourceUrl": "", "contentType": "", "body": "周末不想约人，也不想赶路，就想一个人慢慢走。\n\n在上海住了几年，有些马路真的会反复去。不是每次都要拍照，有时候就是想找条树多的路走一走。\n\n按心情分享8条我会反复逛的路：\n\n🌿 想安静\n思南路：梧桐密、洋房多，走完不用20分钟，但每次都会慢下来。路边偶尔有独立书店，开门时间很随意。\n绍兴路：上海最短的文化街之一。出版社旧址混着咖啡馆和画廊，工作日下午几乎没人。\n\n🌳 想看树\n新华路：两排梧桐把天遮得严严实实，夏天走都不热。洋房院子里偶尔伸出花来。\n复兴西路：老公寓楼集中，走在这条路上会忍不住抬头看阳台，每一栋都不一样。人比武康路少太多。\n\n☕ 想喝咖啡\n衡山路：酒吧咖啡馆混着居民楼，白天树影很美，晚上是另一个世界。\n汾阳路：音乐学院附近，偶尔能听到练琴声。咖啡馆不多但都不错，适合坐一会再走。\n\n📸 想拍照\n多伦路：文化名人故居集中，弹硌路修旧如旧，拍出来有老上海感。\n甜爱路：上海最短的路之一，几十米而已。有个mailbox可以寄明信片，路过四川北路顺便走一下。\n\n不用一次走完。心情不同选不同的路，一个人逛反而自在。", "images": [{"url": "./assets/0826b/01.jpg", "caption": ""}, {"url": "./assets/0826b/02.png", "caption": ""}, {"url": "./assets/0826b/03.png", "caption": ""}, {"url": "./assets/0826b/04.png", "caption": ""}, {"url": "./assets/0826b/05.png", "caption": ""}, {"url": "./assets/0826b/06.png", "caption": ""}, {"url": "./assets/0826b/07.png", "caption": ""}, {"url": "./assets/0826b/08.png", "caption": ""}], "meta": {"来源备注": "{'title': '上海值得反复逛的8条马路，一个人逛也开心', 'url': 'https://www.xiaohongshu.com/discovery/item/68183da1000000002301f434', 'likes': 18595, 'saves': 29309, 'comments': 298}"}}, {"id": "0826", "date": "2026.08.26", "title": "武康路到淮海路，散步天花板", "tags": ["上海Citywalk", "武康路", "周末去哪儿", "上海打卡", "小众旅行地", "上海散步", "梧桐树下", "周末去哪玩"], "status": "待发布", "sourceUrl": "", "contentType": "", "body": "8月底的上海，梧桐最密的那几条路开始有风了。\n\n交大站7号口出来走几分钟，武康大楼就杵在那。这楼不用多介绍，拍了照就行。我一般不在大楼底下久留，往武康路深处走才舒服。\n\n武康路这段是我整条线最喜欢的。梧桐把天遮了大半，路边老洋房门半开着，偶尔有猫。走慢一点，能闻到不知道哪家咖啡馆飘出来的豆子味。没有目的的时候反而最放松。\n\n走到安福路交叉口，画风一变。人一下多了，穿搭水平肉眼可见地高。话剧艺术中心门口常有人等票，RAC Coffee门口坐满了人。我不怎么排队，路过看一眼就够，继续往前。\n\n安福路到头拐进乌鲁木齐中路，这段反而静了。几步路就到，花店、小书店夹在弄堂口，错过就错过了。最后接上淮海中路，往东走几步地铁回家。\n\n全程3公里，两小时左右。不赶、不排、不花钱，就是走。\n\n周末人太多，工作日下午去最舒服。穿双好走的鞋，别开车。", "images": [{"url": "./assets/0826/01.png（武康大楼街角）", "caption": ""}, {"url": "./assets/0826/02.png（武康路梧桐大道）", "caption": ""}, {"url": "./assets/0826/03.png（安福路文艺小店）", "caption": ""}, {"url": "./assets/0826/04.png（淮海中路傍晚）", "caption": ""}], "meta": {"源笔记": "上海citywalk封神线！武康路安福路淮海中路", "源笔记赞": "7028", "源笔记藏": "8006", "源笔记评": "32"}}, {"id": "0825", "date": "2026.08.25", "title": "带爸妈逛上海｜半日精华全走完", "tags": ["周末去哪儿", "上海打卡", "citywalk", "小众旅行地", "周末去哪玩", "上海旅行", "人文景点分享", "带爸妈旅行", "上海半日游"], "status": "待发布", "sourceUrl": "", "contentType": "", "body": "8月底想带爸妈在上海逛半天，又怕他们走不动，这条线实测可以抄。\n\n核心思路：陆家嘴看楼→坐船过江→外滩散步→南京路收尾，全程不绕路，花钱极少。\n\n10点左右到陆家嘴站。出来先把东方明珠和三件套拍了，不用非要登塔，地面拍反而更出片。环岛天桥走过去，角度随便挑。\n\n拍完往东昌路码头走，这步是整条线的灵魂。花2块钱坐轮渡到金陵路码头，江风一吹，黄浦江两岸全景全看到了。爸妈比我还会拍，船上对着两岸拍了快二十张。\n\n下船就是外滩。别急着往前走，先往右拐，那段路人少，明珠塔做背景特别清楚。走到头有英雄纪念碑，再过去就是外白渡桥。我妈说这桥她年轻时候看电视就知道，非要上去走一圈。\n\n过了桥往乍浦路桥方向拐，那一片全是老洋房，随便巷子里钻一钻都好看。最后从南京路步行街收尾，逛逛商店买点特产，走到人民广场那边地铁回。\n\n整条线走完大概3-4小时，步数不到一万，对长辈很友好。关键是该看的一个没落，花钱也就是地铁加轮渡几块钱。", "images": [{"url": "https://cdn-image.bj.bcebos.com/uploads/2026/08/25/72f4b8ce32f947b793ba1495944d536e.png", "caption": ""}, {"url": "https://cdn-image.bj.bcebos.com/uploads/2026/08/25/55ececa1344c446d9cd7d21a9447739d.png", "caption": ""}, {"url": "https://cdn-image.bj.bcebos.com/uploads/2026/08/25/1bede625b63c432199559b695e1da682.png", "caption": ""}, {"url": "https://cdn-image.bj.bcebos.com/uploads/2026/08/25/891795989a284fd184e2d2eaabc151d3.png", "caption": ""}], "meta": {"源笔记": "上海半日游，不累版路线（适合带长辈）", "源笔记赞": "11731", "源笔记藏": "15930", "源笔记评": "261"}}, {"id": "0819", "date": "2026.08.19", "title": "九寨沟一日省腿线", "tags": ["九寨沟攻略", "九寨沟旅游", "四川旅行", "懒人攻略", "省腿路线", "暑假去哪玩", "旅行攻略", "周末去哪儿"], "status": "待发布", "sourceUrl": "https://www.xiaohongshu.com/discovery/item/68a404f1000000001c03e9e6?app_platform=ios&app_version=9.32.3&share_from_user_hidden=true&xsec_source=app_share&type=normal&xsec_token=CBSCRfheEZiS-H74WL-bAAYYLQU9hh8tQTWGTvJcHGW6Y=&author_share=1", "contentType": "", "body": "九寨沟一天想看精华，又不想把腿走废，可以把观光车用到极致。\n\n这条路线适合第一次去、时间只有1天、还想留点体力拍照的人。核心思路很简单：先坐车到高处，再按右线—中转—左线—瀑布—树正沟往下收，不硬走冤枉路。\n\n📍一日顺序可以这样走\n08:00 左右进景区，直接坐观光车到原始森林。这里不用久待，呼吸一下森林空气就够了。\n\n09:30 后往右线精华走：熊猫海、五花海、镜海。五花海颜色最稳，镜海如果早上没风，倒影会很好看。\n\n11:00 到诺日朗中心站吃饭、休息、换线。自带干粮会更省时间，也不用排太久。\n\n12:00 去左线：长海、五彩池。长海开阔，五彩池不大但颜色很亮，这段步行量不算夸张。\n\n13:30 回诺日朗瀑布。别只在下面看，可以找观景台角度，瀑布整体更完整，人也相对分散。\n\n14:10 后往树正寨、火花海方向收尾。还想拍芦苇海的话，在盆景滩附近走一段；如果已经累了，这段可以直接放弃，不影响主线体验。\n\n✅省腿重点\n1. 能坐观光车就坐，不为了“都来都来了”硬走。\n2. 五花海、五彩池、诺日朗瀑布优先级最高。\n3. 原始森林和芦苇海看体力，不必强行打满。\n4. 旺季早点进，越晚中转站越容易排队。\n\n九寨沟真的不需要暴走才算玩到。把时间花在几个最美的点上，一天也能看得很满足。", "images": [{"url": "./assets/0819/01.jpg（原始森林入口）", "caption": ""}, {"url": "./assets/0819/02.jpg（五花海湖水）", "caption": ""}, {"url": "./assets/0819/03.jpg（镜海倒影）", "caption": ""}, {"url": "./assets/0819/04.jpg（长海观景）", "caption": ""}, {"url": "./assets/0819/05.jpg（五彩池）", "caption": ""}, {"url": "./assets/0819/06.jpg（诺日朗瀑布）", "caption": ""}], "meta": {"源笔记": "九寨沟省腿版路线｜一天逛完精华", "源链接": "https://www.xiaohongshu.com/discovery/item/68a404f1000000001c03e9e6?app_platform=ios&app_version=9.32.3&share_from_user_hidden=true&xsec_source=app_share&type=normal&xsec_token=CBSCRfheEZiS-H74WL-bAAYYLQU9hh8tQTWGTvJcHGW6Y=&author_share=1", "素材包": "./assets/zips/0819.zip（原站资源）", "赞藏评": "赞0 藏0 评0 分享0（2026-08-19 更新）"}}, {"id": "0818", "date": "2026.08.18", "title": "上海下班摸鱼展", "tags": ["上海周末去哪儿", "上海免费展", "静安嘉里中心", "上海8月展览", "打工人周末", "上海Citywalk", "下班去哪儿", "魔都看展"], "status": "待发布", "sourceUrl": "https://www.xiaohongshu.com/discovery/item/6a6cb6c1000000002c005ad1?app_platform=ios&app_version=9.32.3&share_from_user_hidden=true&xsec_source=app_share&type=normal&xsec_token=CBzU-iRoqgRe5qzgoEGFQ6L_w7WNyJYU1TfTtKo3VIwDA=&author_share=1", "contentType": "", "body": "下班后不想立刻回家，最近可以去静安嘉里中心摸个鱼。\n\n这里的比奇堡主题展真的很适合牛马：不用做攻略，不用赶路，地铁出来走几步就到。白天人可能多一点，工作日晚上反而舒服，逛一圈、拍几张、再去附近吃点东西，整个人会从工位模式慢慢退出来。\n\n📍地点：静安嘉里中心\n🕒展期：8月3日-8月31日\n💰门票：免费\n🚇交通：静安寺站附近\n\n我最喜欢的是它不是那种“必须认真看懂”的展，纯粹就是给成年人一个短暂放空的借口。海绵宝宝、派大星、章鱼哥摆在那儿，很幼稚，但也很治愈。\n\n如果这个8月周末没安排，或者某天加班加到有点烦，可以把它当成上海市中心的短途逃跑。不用花钱，也不用请假，半小时就能换个心情。", "images": [{"url": "./assets/0818/01.webp（比奇堡主题封面）", "caption": ""}, {"url": "./assets/0818/02.webp（静安嘉里中心展区）", "caption": ""}, {"url": "./assets/0818/03.webp（海绵宝宝打卡位）", "caption": ""}, {"url": "./assets/0818/04.webp（派大星装置）", "caption": ""}, {"url": "./assets/0818/05.webp（章鱼哥主题角）", "caption": ""}, {"url": "./assets/0818/06.webp（展区互动布景）", "caption": ""}, {"url": "./assets/0818/07.webp（商场快闪现场）", "caption": ""}, {"url": "./assets/0818/08.webp（下班摸鱼路线）", "caption": ""}], "meta": {"源笔记": "上海最chill的都是免费的（23/100）", "源链接": "https://www.xiaohongshu.com/discovery/item/6a6cb6c1000000002c005ad1?app_platform=ios&app_version=9.32.3&share_from_user_hidden=true&xsec_source=app_share&type=normal&xsec_token=CBzU-iRoqgRe5qzgoEGFQ6L_w7WNyJYU1TfTtKo3VIwDA=&author_share=1", "素材包": "./assets/zips/0818.zip（原站资源）", "赞藏评": "赞0 藏0 评0 分享0（2026-08-18 更新）"}}, {"id": "0817", "date": "2026.08.17", "title": "上海半日松弛线", "tags": ["上海Citywalk", "上海半日游", "上海周末去哪儿", "陆家嘴", "外滩", "上海轮渡", "南京路步行街", "打工人周末"], "status": "待发布", "sourceUrl": "https://www.xiaohongshu.com/discovery/item/685799ce000000001202157f?app_platform=ios&app_version=9.41.1&share_from_user_hidden=true&xsec_source=app_share&type=normal&xsec_token=CBMkNtptU9XdXVVrQggouEn61XbWXTm5YxRFrnHt0E4SM=&author_share=1", "contentType": "", "body": "8月在上海想安排一个不累的半日游，可以直接走陆家嘴到外滩这条线。它的好处是：地标够经典、交通简单、花钱少，走累了也随时能找地方坐下。\n\n第一站先到陆家嘴。\n地铁到陆家嘴站，出来先看东方明珠和上海三件套。如果只是打卡拍照，不一定非要登塔；想看城市全景再考虑上去。上午光线清爽，傍晚氛围更好，看你想拍哪种感觉。\n\n第二站坐一次黄浦江轮渡。\n从东昌路码头上船，坐到金陵路码头，票价大概2元。这个体验我觉得很上海：不用排很久，也不用花大钱，几分钟就能从浦东切到浦西。上船后尽量站到靠玻璃的位置，江面视野更完整。\n\n第三站慢慢走外滩。\n下船后沿江往外滩方向走，东方明珠、万国建筑群都能一起看到。体力够的话继续到上海人民英雄纪念塔和外白渡桥，喜欢老上海影视感的人，这里会很有记忆点。\n\n第四站绕去乍浦路桥和南京路。\n过外白渡桥后往乍浦路桥走，桥上拍陆家嘴角度很稳。再穿过附近老建筑群到南京路步行街，想买点伴手礼或找商场歇脚都方便。\n\n吃饭我会避开南京路上那种灯牌很密集的美食街，价格和味道都容易踩雷。想吃上海菜就找独立门店，想简单续命，一杯咖啡也够把后半程撑住。\n\n这条线不用赶，半天刚好。适合外地朋友第一次来，也适合上海打工人周末假装游客，重新看一眼自己每天路过的城市。", "images": [{"url": "./assets/0817/01.jpg（陆家嘴东方明珠）", "caption": ""}, {"url": "./assets/0817/02.jpg（上海三件套）", "caption": ""}, {"url": "./assets/0817/03.jpg（黄浦江轮渡）", "caption": ""}, {"url": "./assets/0817/04.jpg（外滩外白渡桥）", "caption": ""}], "meta": {"源笔记": "上海半日游，不累版路线（适合带长辈）", "源链接": "https://www.xiaohongshu.com/discovery/item/685799ce000000001202157f?app_platform=ios&app_version=9.41.1&share_from_user_hidden=true&xsec_source=app_share&type=normal&xsec_token=CBMkNtptU9XdXVVrQggouEn61XbWXTm5YxRFrnHt0E4SM=&author_share=1", "素材包": "./assets/zips/0817.zip（原站资源）", "赞藏评": "赞0 藏0 评0 分享0（2026-08-17 更新）"}}, {"id": "0816", "date": "2026.08.16", "title": "阿加莎展开了", "tags": ["上海看展", "阿加莎克里斯蒂", "徐家汇书院", "上海周末去哪儿", "上海8月展览", "推理小说", "上海免费展览", "打工人周末"], "status": "待发布", "sourceUrl": "https://www.xiaohongshu.com/discovery/item/6a72f6f60000000022017570?app_platform=ios&app_version=9.31.2&share_from_user_hidden=true&xsec_source=app_share&type=normal&xsec_token=CBJf8bNtdV8weqOqdx38IApYtlbB-lCBkRMuXKEbDyuL4=&author_share=1", "contentType": "", "body": "8月在上海想找一个有冷气、又不只是随便逛逛的展，可以把徐家汇书院这场先码住。\n\n主题是「谜案永不落幕——阿加莎·克里斯蒂主题展暨侦探小说珍藏展」，展期从8月15日到10月15日，地点在徐家汇书院三楼展厅。对推理小说党来说，这种展真的很难路过。\n\n我最想看的不是简单打卡墙，而是那些有时间感的东西：阿加莎的长篇小说稿件、早期带书衣初版本、不同年代的签名本，还有《东方快车谋杀案》《无人生还》相关资料。原文里还提到会有柯南·道尔、埃勒里·奎因、约翰·狄克森·卡尔等侦探小说名家的展品，信息量应该会比普通主题展扎实很多。\n\n更戳我的是上海相关部分：四十年代上海出版的《东方快车谋杀案》中译本、七十年代末《尼罗河上的惨案》译制片台本和排片单。不是只讲一个海外作家，而是把推理小说和上海阅读史也串起来了。\n\n我会这样安排：先去徐家汇书院看展，逛完顺路在书院里翻会儿书，外面太热就别硬凑别的点。这个展期够长，不用挤首周末，挑一个工作日傍晚或周末上午会舒服很多。\n\n小提醒：\n1. 展期是8.15-10.15，别拖到最后一周才想起来。\n2. 地点在徐家汇书院三楼，去之前看一下官方最新入场信息。\n3. 推理迷可以多留时间看文字展品，别按拍照展节奏走。\n4. 适合一个人慢慢看，也适合和同样爱看书的朋友一起去。\n\n夏天在上海，有空调、有书、有一点悬疑感的半日安排，已经很难得了。", "images": [{"url": "./assets/0816/01.png（阿加莎主题展封面）", "caption": ""}, {"url": "./assets/0816/02.png（徐家汇书院展厅）", "caption": ""}, {"url": "./assets/0816/03.png（侦探小说珍藏展柜）", "caption": ""}, {"url": "./assets/0816/04.png（东方快车氛围道具）", "caption": ""}, {"url": "./assets/0816/05.png（看展路线信息卡）", "caption": ""}, {"url": "./assets/0816/06.png（徐家汇书院夜景）", "caption": ""}], "meta": {"源笔记": "上海要有阿加莎·克里斯蒂主题展了？！", "源链接": "https://www.xiaohongshu.com/discovery/item/6a72f6f60000000022017570?app_platform=ios&app_version=9.31.2&share_from_user_hidden=true&xsec_source=app_share&type=normal&xsec_token=CBJf8bNtdV8weqOqdx38IApYtlbB-lCBkRMuXKEbDyuL4=&author_share=1", "素材包": "./assets/zips/0816.zip（原站资源）", "赞藏评": "赞0 藏0 评0 分享0（2026-08-16 更新）"}}, {"id": "0815", "date": "2026.08.15", "title": "杭州三天轻松版", "tags": ["杭州旅游", "杭州旅行攻略", "杭州周末去哪儿", "西湖攻略", "灵隐寺", "杭州Citywalk", "短途旅行", "打工人周末"], "status": "待发布", "sourceUrl": "https://www.xiaohongshu.com/discovery/item/687903d6000000001203dbb0?app_platform=ios&app_version=9.32.2&share_from_user_hidden=true&xsec_source=app_share&type=normal&xsec_token=CB_U4jbcrOJL-u9rTg3tYBe7RKA7siIqHIxWQ11OVi5cc=&author_share=1", "contentType": "", "body": "8月想去杭州，又不想把自己排成特种兵，这条3天路线可以直接抄。重点是西湖、寺庙、老街和湿地都保留，但节奏放慢一点，回来不用再请假回血。\n\nDay1 先把西湖放在第一天。\n从断桥附近开始，沿白堤、孤山、苏堤慢慢走，体力够再去曲院风荷、三潭印月、雷峰塔和太子湾。夏天别硬顶正午太阳，下午树荫多的时候再绕湖会舒服很多。\n\nDay2 留给灵隐寺和老杭州。\n早一点去灵隐寺、飞来峰，想去法喜寺也放同一天。结束后不要再塞太远的点，回到杭州博物馆、南宋御街、河坊街这一带逛吃，晚上随便走走就够。\n\nDay3 走轻松收尾线。\n中国湿地博物馆、西溪湿地、杭州植物园、小河直街、拱宸桥、武林夜市，可以按体力选，不建议全打满。小河直街适合慢逛，拱宸桥更有生活气，最后去夜市收尾很顺。\n\n几个避坑我会提前记：\n1. 灵隐寺周边很容易堵，尽量早去，公共交通比临时打车稳。\n2. 飞来峰和灵隐寺门票分开看，别到门口才研究。\n3. 西湖醋鱼不是所有人都吃得惯，片儿川、蟹黄面更稳。\n4. 住宿优先龙翔桥、凤起路、武林广场一带，交通方便比住景区里更重要。\n5. 摇橹船别只盯湖心热门线，人多时可以换苏堤到茅家埠这种更清静的路线。\n\n杭州好玩的地方很多，但三天真的不用贪心。每天一个主线，剩下交给散步和临时起意，反而更像真正放假。", "images": [{"url": "./assets/0815/01.jpg（西湖环线）", "caption": ""}, {"url": "./assets/0815/02.jpg（灵隐寺飞来峰）", "caption": ""}, {"url": "./assets/0815/03.jpg（法喜寺）", "caption": ""}, {"url": "./assets/0815/04.jpg（南宋御街河坊街）", "caption": ""}, {"url": "./assets/0815/05.jpg（西溪湿地）", "caption": ""}, {"url": "./assets/0815/06.jpg（小河直街）", "caption": ""}, {"url": "./assets/0815/07.jpg（拱宸桥）", "caption": ""}, {"url": "./assets/0815/08.jpg（武林夜市）", "caption": ""}], "meta": {"源笔记": "杭州三日游保姆级游玩攻略+避坑指南", "源链接": "https://www.xiaohongshu.com/discovery/item/687903d6000000001203dbb0?app_platform=ios&app_version=9.32.2&share_from_user_hidden=true&xsec_source=app_share&type=normal&xsec_token=CB_U4jbcrOJL-u9rTg3tYBe7RKA7siIqHIxWQ11OVi5cc=&author_share=1", "素材包": "./assets/zips/0815.zip（原站资源）"}}, {"id": "0814", "date": "2026.08.14", "title": "永嘉路夏日慢逛", "tags": ["上海Citywalk", "永嘉路", "上海周末去哪儿", "上海拍照", "梧桐区散步", "上海免费景点", "打工人周末", "8月去哪玩"], "status": "待发布", "sourceUrl": "https://www.xiaohongshu.com/discovery/item/68df505a0000000003034f62?app_platform=ios&app_version=9.31.2&share_from_user_hidden=true&xsec_source=app_share&type=normal&xsec_token=CBwuSjVnDStbIr3PouIpW2sqC-NBx7cvyzM2YB_ohFAJc=&author_share=1", "contentType": "", "body": "8月在上海想散步，我会把永嘉路放进清单前排。它不是那种一路赶景点的路线，更像是在梧桐树荫里给自己放半天假。周五午休刷到这条线，周末直接抄也不费脑。\n\n我的走法很简单：从衡山路/嘉善路一带切进永嘉路，先看太原路口附近的花园洋房，再慢慢往夏衍旧居、思远旧书店、小店橱窗这些点走。中间不用卡时间，看到顺眼的咖啡店就停一下，热了就进店吹会儿空调。\n\n这条路最舒服的是“不用硬凹游客感”：树荫够密，老房子够有味道，沿街小店也不会太吵。比起外滩那种大场面，永嘉路更适合一个人慢慢晃，或者和闺蜜边走边碎碎念。\n\n几个实用提醒：\n1. 现在8月还是热，建议上午10点前或傍晚去。\n2. 拍照不用扎堆，太原路口、老洋房门头、书店外墙都很出片。\n3. 全程不用安排太满，2-3小时刚好。\n4. 鞋子穿舒服点，梧桐区好看的支路很多，容易越走越远。\n\n如果这个周末只想在上海低成本换个心情，永嘉路这条线真的很适合。", "images": [{"url": "./assets/0814/01.jpg（永嘉路梧桐）", "caption": ""}, {"url": "./assets/0814/02.jpg（花园洋房）", "caption": ""}, {"url": "./assets/0814/03.jpg（老洋房门头）", "caption": ""}, {"url": "./assets/0814/04.jpg（沿街小店）", "caption": ""}, {"url": "./assets/0814/05.jpg（太原路口）", "caption": ""}, {"url": "./assets/0814/06.jpg（咖啡店橱窗）", "caption": ""}, {"url": "./assets/0814/07.jpg（夏天树影）", "caption": ""}, {"url": "./assets/0814/08.jpg（慢逛转角）", "caption": ""}], "meta": {"源笔记": "迄今为止，上海我最推荐的一条Citywalk路线", "源链接": "https://www.xiaohongshu.com/discovery/item/68df505a0000000003034f62?app_platform=ios&app_version=9.31.2&share_from_user_hidden=true&xsec_source=app_share&type=normal&xsec_token=CBwuSjVnDStbIr3PouIpW2sqC-NBx7cvyzM2YB_ohFAJc=&author_share=1", "素材包": "./assets/zips/0814.zip（原站资源）", "赞藏评": "赞0 藏0 评0 分享0（2026-08-14 更新）"}}, {"id": "0813", "date": "2026.08.13", "title": "杭州老城半日慢逛", "tags": ["杭州Citywalk", "杭州旅游攻略", "杭州周末去哪儿", "江浙沪周边游", "短途旅行", "暑假去哪玩", "打工人周末", "杭州拍照"], "status": "待发布", "sourceUrl": "https://www.xiaohongshu.com/discovery/item/68835f8b0000000017030b8e?app_platform=ios&app_version=9.42&share_from_user_hidden=true&xsec_source=app_share&type=normal&xsec_token=CBr91DohzWCzxK2_05fJZPWd6fqaivjQzfTGm4gTOgTEU=&author_share=1", "contentType": "", "body": "暑假来杭州，真的别只把西湖当成唯一答案。人多的时候，换一条靠近吴山的轻 Citywalk，体验会舒服很多。\n\n这条线我会这样走：吴山广场站出来，先逛河坊街，再去德寿宫和胡雪岩故居一带慢慢看老杭州的建筑；后半段走十五奎巷、晓霞弄，最后上城隍阁和江湖汇观亭，把西湖和老城一起收进视野里。\n\n它最适合的不是暴走打卡，而是半天慢逛：有街巷、有老建筑、有一点轻爬坡，也有能停下来拍照的转角。比起在西湖边人挤人，我更喜欢这种边走边发现的路线。\n\n几个8月提醒：\n1. 上午或傍晚走更舒服，中午这段坡路会热。\n2. 河坊街不用久留，顺路穿过去就好。\n3. 想看西湖视角，江湖汇观亭这段别省。\n4. 鞋子穿好走的，后半段有上坡。\n\n如果周末只想给杭州留半天，这条比硬绕西湖轻松，也更有老城味道。", "images": [{"url": "./assets/0813/01.jpg（吴山广场）", "caption": ""}, {"url": "./assets/0813/02.jpg（河坊街）", "caption": ""}, {"url": "./assets/0813/03.jpg（德寿宫）", "caption": ""}, {"url": "./assets/0813/04.jpg（胡雪岩故居）", "caption": ""}, {"url": "./assets/0813/05.jpg（十五奎巷）", "caption": ""}, {"url": "./assets/0813/06.jpg（晓霞弄）", "caption": ""}, {"url": "./assets/0813/07.jpg（城隍阁）", "caption": ""}, {"url": "./assets/0813/08.jpg（江湖汇观亭）", "caption": ""}], "meta": {"源笔记": "来杭州别只去西湖！强推小众citywalk路线", "源链接": "https://www.xiaohongshu.com/discovery/item/68835f8b0000000017030b8e?app_platform=ios&app_version=9.42&share_from_user_hidden=true&xsec_source=app_share&type=normal&xsec_token=CBr91DohzWCzxK2_05fJZPWd6fqaivjQzfTGm4gTOgTEU=&author_share=1", "素材包": "./assets/zips/0813.zip（原站资源）", "赞藏评": "赞0 藏0 评0 分享0（2026-08-13 更新）"}}, {"id": "0812", "date": "2026.08.12", "title": "南京48h慢逛版", "tags": ["南京旅游", "南京citywalk", "南京周末去哪儿", "江浙沪周边游", "短途旅行", "周末去哪儿", "南京攻略", "暑假去哪玩"], "status": "已发布", "sourceUrl": "", "contentType": "", "body": "南京这条48小时路线更适合想轻松走、又不想把自己排太满的人。\n\n我会把它拆成两段：第一天看湖、看路、看老城的气质，第二天把山水和村子放在一起，节奏会比硬塞景点舒服很多。\n\nDay1可以这样排：玄武湖先开场，绕着湖边走一圈再去先锋书店歇一下；梧桐大道和音乐台放在下午，光线软一点，人也更松；西桥和附近老街留到傍晚，顺手把晚饭解决掉。\n\nDay2我会把中山码头和江边路放前面，沿着滨江吹风，再去下关火车主题公园慢慢走；最后留一个长江大桥玻璃栈桥收尾，等火车经过那一段很值。\n\n如果还有半天，就把江南明城墙或其他顺路点加进去，不用追求一口气跑完。南京好玩的地方本来就不是“越多越好”，而是你愿意停下来看的那几段。\n\n几个小提醒：\n1. 玄武湖和滨江这类点位更适合早晚去，光线舒服。\n2. 梧桐路线别赶太快，慢一点更像这座城。\n3. 夏天去记得留一段室内或树荫多的路。\n4. 48小时足够，但别按特种兵节奏走。", "images": [{"url": "./assets/0812/01.jpg（玄武湖）", "caption": ""}, {"url": "./assets/0812/02.jpg（先锋书店）", "caption": ""}, {"url": "./assets/0812/03.jpg（梧桐大道）", "caption": ""}, {"url": "./assets/0812/04.jpg（音乐台）", "caption": ""}, {"url": "./assets/0812/05.jpg（西桥）", "caption": ""}, {"url": "./assets/0812/06.jpg（江边路）", "caption": ""}, {"url": "./assets/0812/07.jpg", "caption": ""}, {"url": "./assets/0812/08.jpg", "caption": ""}], "meta": {"素材包": "./assets/zips/0812.zip（原站资源）", "发布链接": "https://www.xiaohongshu.com/discovery/item/6a8301800000000033009ee1", "发布时间": "2026-08-17 20:41", "赞藏评": "赞21 藏10 评0 分享0（2026.09.02 更新）"}}, {"id": "0811", "date": "2026.08.11", "title": "上海三伏天不花钱能逛一天的地方", "tags": ["上海citywalk", "上海免费景点", "周末去哪儿", "上海探店", "夏日避暑", "城市漫步", "上海周末去哪玩", "宝藏打卡地"], "status": "已发布", "sourceUrl": "https://www.xiaohongshu.com/discovery/item/6a61f0a7000000000f02a63d", "contentType": "", "body": "大暑刚过，上海每天不是暴晒就是暴雨，但空调房待久了人也发霉。\n整理一份我私藏的市中心避暑地图，全程有空调有冷气，大部分不花钱，花也就一杯咖啡钱。\n\n📍 Fotografiska 摄影艺术中心\n一楼杂货铺不收费就能逛，海报、周边、小摆件审美在线，逛完出来心情会好一个档次。楼上展览要票，但一楼足够消磨半小时。\n\n📍 星期天公园（长宁）\n长宁最近的人气担当，咖啡、餐食、文创一体，连卫生间都做得很有梗。chill 氛围拉满，适合发呆一下午。\n\n📍 上生新所\n老牌文艺地标但常逛常新。SIGMA 空间定期有免费展，24小时自助超市挺有意思，走之前去茑屋书店翻翻书。\n\n📍 何东旧居\n市中心的绿洲，jaja 衣品不错，底楼梦核的设计展值得看，历目展厅经常有新展更新。\n\n📍 PSA + 等等图书馆\n当代艺术馆永远不缺免费好展，最近 Chanel 等等图书馆入驻，城市资源利用到极致。\n\n📍 苏河皓司\n苏州河边的小众画廊聚集地，一层新空间很出片，展期短但质量高，挑不出毛病。\n\n📍 朵云书院（滴水湖）\n住附近的人真的很幸福，可以待一整天。市区过去太远，住附近的可以当据点。\n\n📍 徐家汇书院\n布局对强迫症极度友好，安静、安心，适合想找个地方坐下来写东西的时候去。\n\n三伏天别硬撑着出门遛弯，挑一个有冷气的地方待着，比什么都强。", "images": [{"url": "./assets/0811/01.jpg（Fotografiska一楼杂货铺）", "caption": ""}, {"url": "./assets/0811/02.jpg（星期天公园文创空间）", "caption": ""}, {"url": "./assets/0811/03.jpg（上生新所SIGMA空间）", "caption": ""}, {"url": "./assets/0811/04.jpg（何东旧居庭院）", "caption": ""}, {"url": "./assets/0811/05.jpg（PSA当代艺术馆）", "caption": ""}, {"url": "./assets/0811/06.jpg（苏河皓司画廊）", "caption": ""}, {"url": "./assets/0811/07.jpg（朵云书院滴水湖）", "caption": ""}, {"url": "./assets/0811/08.jpg（徐家汇书院）", "caption": ""}], "meta": {"源笔记": "如何在三伏天更好地使用上海🫠（避暑免费版", "源链接": "https://www.xiaohongshu.com/discovery/item/6a61f0a7000000000f02a63d", "素材包": "0811.zip（原站资源）", "发布链接": "https://www.xiaohongshu.com/discovery/item/6a7d9918000000002202c777", "发布时间": "2026-08-13 18:14", "赞藏评": "赞19 藏29 评0 分享1（2026.08.27 更新）"}}, {"id": "0810b", "date": "2026.08.10", "title": "上海书展8月来了‼攻略先码住", "tags": ["上海书展", "上海展览中心", "周末去哪儿", "阅读", "文化盛宴", "看书好去处", "上海超有料", "上海周末去哪儿", "薅羊毛", "阅读唤醒生活新鲜式"], "status": "已发布", "sourceUrl": "", "contentType": "", "body": "刷到官方通知的时候差点从工位上跳起来——上海书展定档8月12到18号，在上海展览中心。\n\n4.4万㎡场地、400多家展商，光看数字就知道这次规模不会小。最期待的是\"阅界夜市\"回归，夏夜逛书市集这种事，对我来说比加班有意义太多了。\n\n📍展前必做三件事\n1. 提前在小程序买好门票，现场排队买票真的浪费时间\n2. 身份证一定带上，今年实名制入场\n3. 地铁2/7/14号线静安寺站8号口出来最近，别想着开车去\n\n📍我的逛展计划\n先冲主展区看有哪些出版社，再去阅读生活跨界区逛文创（这是我最想花钱的地方），最后留时间给新书发布和签售。夜场开了我就在市集多待一会儿，买本书听个分享，这种夏夜比刷手机强。\n\n📍省钱小提醒\n早鸟冲现场能领惠民阅读券，能省则省。文创和书别现场冲动买太多，先逛完一圈再决定。\n\n这个八月，我准备把周末交给书海了。", "images": [{"url": "./assets/0810b/01.png（官方通知截图风格封面）", "caption": ""}, {"url": "./assets/0810b/02.png（上海展览中心建筑外观）", "caption": ""}, {"url": "./assets/0810b/03.png（书展展区平面图手绘）", "caption": ""}, {"url": "./assets/0810b/04.png（文创周边宣传图）", "caption": ""}, {"url": "./assets/0810b/05.png（书堆特写）", "caption": ""}, {"url": "./assets/0810b/06.png（地铁静安寺站标识）", "caption": ""}, {"url": "./assets/0810b/07.png（手绘逛展路线清单）", "caption": ""}, {"url": "./assets/0810b/08.png（书展亮点速览卡片）", "caption": ""}], "meta": {"素材包": "./assets/zips/0810b.zip（原站资源）", "发布链接": "https://www.xiaohongshu.com/discovery/item/6a7aa358000000002500847b", "发布时间": "2026-08-11 12:21", "赞藏评": "赞5 藏0 评0 分享0（2026.08.27 更新）"}}, {"id": "0809", "date": "2026.08.09", "title": "洒写下的千字周末可以去", "tags": ["洒写下的千字旅行", "洒写下的千字攻略", "周末去哪儿", "短途旅行", "打工人周末", "小红书旅行攻略"], "status": "待发布", "sourceUrl": "", "contentType": "", "body": "最近想找一个不用做太重攻略的去处，洒写下的千字这篇刚好可以收着。它不是那种必须冲KPI式打卡的玩法，更适合周末慢慢逛。\n\n我会优先看这几个点：土耳其大哥洋洋洒洒写下的。\n\n安排上可以简单一点：上午晚点出门，中午到附近吃饭，下午逛主线，傍晚看情况加一个顺路点。\n\n我比较喜欢这种低压力玩法，计划有，但不把自己绑死。走累了就找地方坐，天气不好就改室内，反正周末出门的目的不是打满行程表，是换个地方喘口气。", "images": [{"url": "./assets/0809/01.jpg（土耳其大哥洋洋洒洒写下的）", "caption": ""}, {"url": "./assets/0809/02.jpg", "caption": ""}, {"url": "./assets/0809/03.jpg", "caption": ""}, {"url": "./assets/0809/04.jpg", "caption": ""}, {"url": "./assets/0809/05.jpg", "caption": ""}, {"url": "./assets/0809/06.jpg", "caption": ""}], "meta": {"素材包": "./assets/zips/0809.zip（原站资源）"}}, {"id": "0806", "date": "2026.08.06", "title": "呼伦贝尔6天｜不踩坑草原路线", "tags": ["呼伦贝尔旅行", "呼伦贝尔旅游攻略", "内蒙古旅行", "草原旅行", "暑假去哪玩", "呼伦贝尔路线", "莫尔格勒河", "呼伦湖"], "status": "已发布", "sourceUrl": "", "contentType": "", "body": "第一次去呼伦贝尔，最容易被它的面积打蒙。\n\n从海拉尔出发，草原、湿地、森林到湖边，每个方向都想碰一下，但路上花的时间比想象中多很多。整理了一条走了不亏的6天5晚路线，每天车程控制在合理范围，重点点位都能覆盖。\n\n📋按这个走就行\nD1 海拉尔出发→两河圣山看一眼全景→莫尔格勒河沿河走走→湿地ATV穿一段→下午去牧民家里坐坐→额尔古纳住下\nD2 额尔古纳→白桦林拍照→穿大兴安岭→兴安神鹿园喂鹿→莫尔道嘎镇过夜\nD3 早上莫尔道嘎坐森林小火车→老鹰嘴打卡→室韦边境小镇吃饭→恩和做套娃烤列巴→住恩和木屋\nD4 恩和出发走边防公路→七八六五卡这段一路停→太极图观景→黑山头骑马等日落→晚上篝火住蒙古包\nD5 黑山头滑草→继续走边防路→呼伦湖边私藏白崖看水→满洲里逛婚礼宫和国门外景\nD6 满洲里→风车公路拍照→扎赉诺尔博物馆→巴尔虎看马术→回海拉尔\n\n💡几个过来人的提醒\n1 路况不熟就别硬自驾，草原里导航经常失灵，找个当地领队会省很多事\n2 牧场基本都有主人，看到好看的画面别直接开进去，先问一下\n3 蒙古包和篝火在黑山头体验最完整，提前跟住宿确认有没有安排\n4 8月是呼伦贝尔最旺的时候，车和房越早订越好\n\n这条线的节奏不紧，每天留了时间慢慢逛和拍照，适合第一次去想一次走完核心点位的人。", "images": [{"url": "./assets/0806/01.jpg（莫尔格勒河全景）", "caption": ""}, {"url": "./assets/0806/02.jpg（大兴安岭白桦林）", "caption": ""}, {"url": "./assets/0806/03.jpg（兴安神鹿园）", "caption": ""}, {"url": "./assets/0806/04.jpg（边防公路沿途）", "caption": ""}, {"url": "./assets/0806/05.jpg（黑山头日落骑马）", "caption": ""}, {"url": "./assets/0806/06.jpg（呼伦湖白崖）", "caption": ""}], "meta": {"素材包": "./assets/zips/0806.zip（原站资源）", "发布链接": "https://www.xiaohongshu.com/discovery/item/6a7467a50000000033013ef7", "发布时间": "2026-08-06 18:53", "赞藏评": "赞3 藏2 评2 分享1（2026.08.27 更新）"}}, {"id": "0805", "date": "2026.08.05", "title": "青岛3天不绕路攻略", "tags": ["青岛旅行", "青岛旅游攻略", "周末去哪儿", "短途旅行攻略", "青岛拍照", "青岛citywalk", "海边旅行", "暑假去哪玩"], "status": "待发布", "sourceUrl": "", "contentType": "", "body": "青岛这种城市很容易让人临时改计划。天气一变，海边和老城区的顺序就得跟着换，但只要路线排顺了，三天还是能玩得很舒服。\n\n这次更适合想拍海、想逛老城、又不想把自己走到太累的人。没有特种兵暴走，重点就是把即墨古城、老城坡路和小麦岛这几段拆开玩。\n\n📍三天可以直接照着走\nDay1：先去即墨古城慢慢逛→晚上住古城附近，留一点时间给民宿院子和夜景\nDay2：西陵峡路→圣弥厄尔教堂→小鱼山→福山支路→宫崎骏漫画街，老城这一整段放一起最顺\nDay3：下午去小麦岛看海→傍晚转去沙子口等日落和蓝调，收尾会很漂亮。\n\n✅这条线最值的地方\n1. 雨天晴天都能接住\n即墨古城和民宿院子很适合天气一般的时候先去，不会白跑\n2. 老城区点位比较集中\n教堂、小鱼山和几条坡路能一口气走完，不用来回折返\n3. 海边安排在最后更稳\n小麦岛和沙子口都更吃光线，下午到日落这段最容易出片\n4. 节奏不赶\n三天里每天重点都不算多，适合周末加一天年假的轻旅行。\n\n⚠去之前记得\n1. 青岛真的很看天气，出发前最好再看一眼风和云量\n2. 小鱼山更适合上午去，海边拍照尽量留到傍晚\n3. 老城坡路不少，鞋子一定选好走的\n4. 如果住即墨古城附近，第二天再进市区会更从容。\n\n如果最近想找一条海边、老城、拍照都能兼顾的三天路线，这条青岛线值得先存。", "images": [{"url": "./assets/0805/01.jpg（小麦岛海边）", "caption": ""}, {"url": "./assets/0805/02.jpg（沙子口日落）", "caption": ""}, {"url": "./assets/0805/03.jpg（老城坡路）", "caption": ""}, {"url": "./assets/0805/04.jpg（圣弥厄尔教堂）", "caption": ""}, {"url": "./assets/0805/05.jpg（即墨古城）", "caption": ""}, {"url": "./assets/0805/06.jpg（民宿院子）", "caption": ""}], "meta": {"素材包": "./assets/zips/0805.zip（原站资源）"}}, {"id": "0804", "date": "2026.08.04", "title": "河北周末躺海攻略", "tags": ["河北周边游", "唐山旅游", "周末去哪儿", "短途旅行攻略", "小众度假好去处", "夏日避暑好去处", "海边旅行", "周末出逃"], "status": "待发布", "sourceUrl": "", "contentType": "", "body": "如果最近只想找个不用飞太远、节奏也别太赶的周末海边，我会把河北唐山这条线放进备选。\n\n这篇更像适合暑假尾声去放空的轻度假路线，没有特种兵暴走，核心就是住得近、玩得松、顺手还能赶海。\n\n📍可以直接抄这条顺路安排\n到唐山多玛乐园入住水上木屋→白天先把园区里几个玩水和捞鱼项目慢慢玩掉→傍晚去坐落日游船→晚上在木屋附近休息\n第二天把没来得及玩的溪谷漂流、浑水摸鱼和园区活动补完，再返程。\n\n✅我觉得这条线值的地方\n1. 不用跑很远也有海岛度假感\n河北这个方向对短途出逃很友好，少了很多舟车劳顿\n2. 玩法比较集中\n住在园区附近，赶海、摸鱼、漂流、看日落都能放在一条线上解决\n3. 更适合慢慢玩\n不是那种必须打满景点的路线，留白比较多，心情会轻松很多\n4. 场景对拍照和亲近水边都友好\n水上木屋、傍晚船景、浅滩活动拍出来都挺有假期感\n\n⚠去之前记得\n1. 夏天玩水项目多，衣服和拖鞋最好提前备一套\n2. 傍晚和早晚风感会明显一点，薄外套别省\n3. 园区项目多但不用全冲，按体力挑重点玩更舒服\n4. 如果想拍到更空的水边画面，尽量避开最热闹的时段\n\n如果最近已经看腻了人挤人的热门海边，这种近一点、松一点的周末海边线，反而更容易留下好感。", "images": [{"url": "./assets/0804/01.jpg（水上木屋）", "caption": ""}, {"url": "./assets/0804/02.jpg（园区水景）", "caption": ""}, {"url": "./assets/0804/03.jpg（赶海项目）", "caption": ""}, {"url": "./assets/0804/04.jpg（漂流场景）", "caption": ""}, {"url": "./assets/0804/05.jpg（傍晚游船）", "caption": ""}, {"url": "./assets/0804/06.jpg（日落海边）", "caption": ""}], "meta": {"素材包": "./assets/zips/0804.zip（原站资源）"}}, {"id": "0803", "date": "2026.08.03", "title": "上海这条路太好逛了", "tags": ["上海citywalk", "上海周末去哪儿", "永嘉路", "上海旅行", "上海拍照", "周末去哪儿", "梧桐区散步", "上海路线"], "status": "待发布", "sourceUrl": "", "contentType": "", "body": "在上海待久了会发现，真正适合一个人慢慢走的路线，不一定是景点最密的那条，而是走着走着会自然放松下来的那种。\n\n最近反复被种草的是永嘉路这条线。梧桐够密，洋房够好看，小店也不是那种只适合拍照打卡的空壳，真的能一路逛得很舒服。\n\n📍这条线可以这样走\n太原路与永嘉路路口出发→夏衍旧居→思远旧书店→Dimoon→铁手珈啡制造局→Melt season→瑞金宾馆外侧散步→有体力的话再继续往附近咖啡店和小店慢慢晃。\n\n✅我觉得这条路最值的点\n1. 不晒也不赶\n梧桐多，走起来比很多暴晒路线舒服很多\n2. 洋房和小店密度刚好\n不是只看建筑，也不是只逛店，节奏比较平衡\n3. 一个人去也不尴尬\n旧书店、咖啡店、街景都很适合自己慢慢消磨半天\n4. 很适合周末低成本出门\n不用专门做复杂攻略，跟着这条路走就够了\n\n⚠小提醒\n1. 想拍空一点尽量上午去\n2. 有些小店营业时间不完全一样，去之前最好看一眼\n3. 这条线更适合慢慢逛，不建议塞太多别的点\n\n如果最近只想在上海找一条不用费脑子、走完心情会变好的 Citywalk，这条真的可以先存着。", "images": [{"url": "./assets/0803/01.jpg（永嘉路街景）", "caption": ""}, {"url": "./assets/0803/02.jpg（花园洋房）", "caption": ""}, {"url": "./assets/0803/03.jpg（夏衍旧居）", "caption": ""}, {"url": "./assets/0803/04.jpg（旧书店）", "caption": ""}, {"url": "./assets/0803/05.jpg（咖啡店）", "caption": ""}, {"url": "./assets/0803/06.jpg（路边细节）", "caption": ""}], "meta": {"素材包": "./assets/zips/0803.zip（原站资源）"}}, {"id": "0802", "date": "2026.08.02", "title": "周末出门抄这条就行", "tags": ["周末去哪儿", "抄作业旅行攻略", "周末去哪玩", "短途旅行", "小众旅行地", "城市体验"], "status": "待发布", "sourceUrl": "", "contentType": "", "body": "这两天翻小红书最容易存下来的，还是那种信息给得够全、去了也不容易踩空的周末路线。\n\n我现在选内容会更偏这种：地点清楚、顺路、不需要太强体力，也不会为了打卡把自己搞得很赶。\n\n✅我会优先留的理由\n1. 客观信息完整，拿来就能抄\n2. 适合周末半天到一天安排\n3. 不靠夸张情绪词也能让人想收藏\n\n如果最近也想找一条省脑子的出门思路，这类笔记真的最实用。", "images": [{"url": "./assets/0802/01.jpg（路线封面）", "caption": ""}, {"url": "./assets/0802/02.jpg（现场入口）", "caption": ""}, {"url": "./assets/0802/03.jpg（核心点位）", "caption": ""}, {"url": "./assets/0802/04.jpg（拍照位置）", "caption": ""}, {"url": "./assets/0802/05.jpg（环境细节）", "caption": ""}, {"url": "./assets/0802/06.jpg（路线收尾）", "caption": ""}], "meta": {"素材包": "./assets/zips/0802.zip（原站资源）"}}, {"id": "0801", "date": "2026.08.01", "title": "周末出门抄这条就行", "tags": ["周末去哪儿", "抄作业旅行攻略", "周末去哪玩", "短途旅行", "小众旅行地", "城市体验"], "status": "待发布", "sourceUrl": "", "contentType": "", "body": "这两天翻小红书最容易存下来的，还是那种信息给得够全、去了也不容易踩空的周末路线。\n\n我现在选内容会更偏这种：地点清楚、顺路、不需要太强体力，也不会为了打卡把自己搞得很赶。\n\n✅我会优先留的理由\n1. 客观信息完整，拿来就能抄\n2. 适合周末半天到一天安排\n3. 不靠夸张情绪词也能让人想收藏\n\n如果最近也想找一条省脑子的出门思路，这类笔记真的最实用。", "images": [{"url": "./assets/0801/01.jpg（路线封面）", "caption": ""}, {"url": "./assets/0801/02.jpg（现场入口）", "caption": ""}, {"url": "./assets/0801/03.jpg（核心点位）", "caption": ""}, {"url": "./assets/0801/04.jpg（拍照位置）", "caption": ""}, {"url": "./assets/0801/05.jpg（环境细节）", "caption": ""}, {"url": "./assets/0801/06.jpg（路线收尾）", "caption": ""}], "meta": {"素材包": "./assets/zips/0801.zip（原站资源）"}}, {"id": "0731", "date": "2026.07.31", "title": "洞头周末看海攻略", "tags": ["周末去哪儿", "江浙沪周边游", "温州洞头", "海边旅行", "海岛攻略", "周末去哪玩", "短途旅行", "小众旅行地"], "status": "待发布", "sourceUrl": "", "contentType": "", "body": "最近很想找个不用请假、也不用折腾转船的海边地方放空一下，温州洞头刚好合适。\n\n上海出发做周末 2 天 1 晚没压力，路线也不绕。海边彩色渔村、断崖步道、月堤散步、望海楼看开阔海景，一趟下来节奏很舒服。\n\n📍我这次更推荐这样走\nDay1：到洞头→七彩洞头村慢慢逛→七彩网红巷拍照→海上阳台等日落→东岙沙滩吹风\nDay2：半屏大桥→半屏山看断崖海浪→海上月堤散步→望海楼收尾→返程\n\n✅几个我觉得最值的点\n1. 七彩洞头村\n彩色房子真的很适合晴天去，随便走走都很出片\n2. 海上阳台\n看日落很稳，风会大一点，但景色值得\n3. 半屏山\n断崖和海浪一起出现的时候，画面很震\n4. 海上月堤\n适合放空散步，节奏很慢\n5. 望海楼\n想看更开阔的海景，可以把这里放在最后\n\n🚗交通和花费\n温州市区到洞头大概 1 小时，岛上景点之间更建议打车。半屏山、望海楼门票都在 30 元/人左右，其他点大多可以免费逛。\n\n⚠去之前记得\n1. 尽量挑晴天，海水颜色真的差很多\n2. 海边风大，防晒和防风都要带\n3. 想拍空一点，渔村和半屏山都建议早去\n4. 住在七彩洞头村附近最省事\n\n如果最近只想短暂离开工位两天，洞头这种不折腾的小海岛城市，真的很适合。", "images": [{"url": "./assets/0807/01.jpg（七彩洞头村）", "caption": ""}, {"url": "./assets/0807/02.jpg（海上阳台日落）", "caption": ""}, {"url": "./assets/0807/03.jpg（七彩网红巷）", "caption": ""}, {"url": "./assets/0807/04.jpg（半屏山断崖）", "caption": ""}, {"url": "./assets/0807/05.jpg（海上月堤）", "caption": ""}, {"url": "./assets/0807/06.jpg（望海楼海景）", "caption": ""}, {"url": "./assets/0807/07.jpg", "caption": ""}, {"url": "./assets/0807/08.jpg", "caption": ""}], "meta": {"素材包": "./assets/zips/0731.zip（原站资源）"}}, {"id": "0730", "date": "2026.07.30", "title": "温州洞头2天1晚攻略", "tags": ["周末去哪儿", "江浙沪周边游", "海边旅行", "温州洞头", "小众旅行地", "周末去哪玩", "海岛攻略", "短途旅行"], "status": "已发布", "sourceUrl": "", "contentType": "", "body": "看海这件事，真的很适合拿来给打工人续命。\n\n这次去的是温州洞头，不用坐船，上岛门槛比很多海岛都低，上海出发周末两天一晚就够。海边彩色渔村、断崖、步道、日落，节奏刚刚好。\n\n📍2天1晚我会这样走\nDay1：到洞头→七彩洞头村→海上阳台等日落→七彩网红巷慢慢逛→东岙沙滩吹风\nDay2：半屏大桥→半屏山→海上月堤→望海楼→返程\n\n✅几个值得留时间的点\n1. 七彩洞头村\n房子颜色很亮，天气好时特别出片，沿路走走停停就很舒服\n2. 海上阳台\n傍晚看日落很稳，风大但很值\n3. 七彩网红巷\n阶梯和彩墙都很好拍，适合慢慢逛\n4. 半屏山\n断崖和海浪同框，画面很震，早一点去人会少些\n5. 海上月堤\n适合散步发呆，节奏很松\n6. 望海楼\n能从高处看海，风景开阔很多\n\n🚗交通怎么弄\n从温州市区过去大概1小时，洞头岛上更建议打车，景点之间不算远，省时间。\n\n💰费用参考\n半屏山、望海楼门票都在30元/人，其余大多数点位可以免费逛。\n\n⚠小提醒\n1. 尽量挑晴天去，海的颜色会差很多\n2. 海边风大，防晒和防风都别省\n3. 想拍空一点的画面，半屏山和渔村都建议早去\n4. 住七彩洞头村附近最方便，出门就是海\n\n如果最近真的很想离开工位一下，洞头这种不用太折腾的海边小城，很适合周末短暂出逃。", "images": [{"url": "./assets/0808/01.jpg（七彩洞头村）", "caption": ""}, {"url": "./assets/0808/02.jpg（海上阳台日落）", "caption": ""}, {"url": "./assets/0808/03.jpg（七彩网红巷）", "caption": ""}, {"url": "./assets/0808/04.jpg（半屏山断崖）", "caption": ""}, {"url": "./assets/0808/05.jpg（海上月堤）", "caption": ""}, {"url": "./assets/0808/06.jpg（望海楼海景）", "caption": ""}, {"url": "./assets/0808/07.jpg", "caption": ""}, {"url": "./assets/0808/08.jpg", "caption": ""}], "meta": {"素材包": "./assets/zips/0730.zip（原站资源）", "发布链接": "https://www.xiaohongshu.com/discovery/item/6a7005a10000000005023159", "发布时间": "2026-08-03 11:06", "赞藏评": "赞6 藏4 评0 分享2（2026.08.27 更新）"}}, {"id": "0728", "date": "2026.07.28", "title": "上海2元轮渡攻略", "tags": ["周末去哪儿", "上海citywalk", "上海免费景点", "上海旅行", "黄浦江轮渡", "外滩攻略", "周末去哪玩", "上海拍照"], "status": "待发布", "sourceUrl": "", "contentType": "", "body": "上海有些快乐真的不用花大钱。\n\n最近又去坐了一次黄浦江轮渡，2块钱横穿江面，比很多观景位都松弛。适合一个人发呆，也适合约闺蜜下班后吹吹风。\n\n📍怎么坐\n最经典的是金陵东路渡口⇄东昌路渡口。浦西这边离外滩、豫园都不远，浦东下船后可以顺路走到陆家嘴滨江。\n\n🚢体验感\n船程不长，大概几分钟，但江风、轮船声、两岸高楼一起出现的时候，会突然觉得上海很电影。白天看城市线条，傍晚看天色变暗，晚上看灯光最稳。\n\n📸我会这样走\n金陵东路渡口上船→东昌路渡口下船→滨江步道慢慢走→拍陆家嘴三件套→如果还有体力，再坐回浦西去外滩。\n\n⚠小提醒\n1. 别卡末班，出发前看一下实时班次\n2. 周末傍晚人会多，想拍照就早点去\n3. 风大的时候头发会乱，但照片反而更像随手拍\n4. 不用专门穿太精致，舒服最重要\n\n两块钱买一段江风，真的很上海。", "images": [{"url": "./assets/0728/01.jpg（金陵东路渡口）", "caption": ""}, {"url": "./assets/0728/02.jpg（轮渡甲板江景）", "caption": ""}, {"url": "./assets/0728/03.jpg（黄浦江两岸）", "caption": ""}, {"url": "./assets/0728/04.jpg（东昌路渡口）", "caption": ""}, {"url": "./assets/0728/05.jpg（陆家嘴滨江）", "caption": ""}, {"url": "./assets/0728/06.jpg（外滩夜景）", "caption": ""}, {"url": "./assets/0728/07.jpg（随手拍机位）", "caption": ""}, {"url": "./assets/0728/08.jpg（路线提示）", "caption": ""}], "meta": {"素材包": "./assets/zips/0728.zip（原站资源）"}}, {"id": "0728dongye", "date": "2026.07.28", "title": "再见了，东野圭吾", "tags": ["东野圭吾", "东野圭吾去世", "白夜行", "嫌疑人X的献身", "读书推荐", "推理小说", "读书笔记", "我的书单"], "status": "已发布", "sourceUrl": "", "contentType": "", "body": "7月23日，东野圭吾因大肠癌去世，享年68岁。\n\n看到消息的时候愣了很久。\n\n我的第一本东野圭吾不是《嫌疑人X的献身》，是《白夜行》。\n\n高中图书馆借的，封面已经翻烂了。那天下午开始看，一口气读到熄灯。雪穗和亮司，两个在黑暗里共生的人，像藤蔓一样缠绕了整本书。\n\n\"我的天空里没有太阳，总是黑夜，但并不暗，因为有东西代替了太阳。\"\n\n这句话抄在了我的笔记本扉页上，抄了很多年。\n\n后来才知道，很多人入坑是《嫌疑人X的献身》。石神为爱设计的那个不在场证明，确实精妙。但对我来说，东野圭吾等于白夜行。\n\n那种冷峻的温柔，案件是壳，人性是核。写的是犯罪，讲的是孤独。\n\n再后来一本接一本读：\n《解忧杂货店》跨越时空的温柔回信\n《秘密》比死亡更让人心碎的选择\n《恶意》看到最后才懂的深不见底的恨\n\n他的角色像真实存在过的人，合上书还会想起。\n\n四十年，一百多部作品。从大阪的汽车零件工程师到国民级作家，他撑起了多少个深夜的阅读灯。\n\n竹内亮发了追悼视频，紫金陈说\"他是我的推理启蒙者\"。\n\n而我只是千万个在深夜翻开过他书的普通读者之一。但我的第一页，是从白夜行开始的。\n\n灯熄了。\n但白夜里的光，还在。\n\n东野先生，一路走好。", "images": [{"url": "./assets/0728dongye/01.jpg（灯下旧书）", "caption": ""}, {"url": "./assets/0728dongye/02.jpg（两个影子）", "caption": ""}, {"url": "./assets/0728dongye/03.jpg（深夜读到熄灯）", "caption": ""}, {"url": "./assets/0728dongye/04.jpg（书架空了一格）", "caption": ""}, {"url": "./assets/0728dongye/05.jpg（为它点一支蜡烛）", "caption": ""}, {"url": "./assets/0728dongye/06.jpg（白夜里的城市）", "caption": ""}], "meta": {"素材包": "./assets/zips/0728dongye.zip（原站资源）", "发布链接": "https://www.xiaohongshu.com/discovery/item/6a68ed7b000000000100333b", "发布时间": "2026-07-29 01:57", "赞藏评": "赞5 藏0 评2 分享0（2026.08.27 更新）"}}, {"id": "0727", "date": "2026.07.27", "title": "上海12个免费好地方", "tags": ["周末去哪儿", "上海免费景点", "上海citywalk", "上海旅行", "爱上海的十万个理由", "上海拍照", "周末去哪玩", "上海攻略"], "status": "待发布", "sourceUrl": "", "contentType": "", "body": "上海这种城市很适合临时起意出门。\n不想花钱、不想做复杂攻略，也照样能把周末过得很舒服。\n\n整理了12个我觉得值得反复去的免费地方，适合一个人散步，也适合约闺蜜慢慢晃，拍照和放空都不浪费👇\n\n📍适合顺路走走的\n1. 世博文化公园\n草坪大、空间松，傍晚去最舒服\n2. 宝山滨江公园\n江风很足，发呆看船都很治愈\n3. 北外滩\n白天看江景，晚上看天际线，怎么走都不亏\n4. 外白渡桥\n老上海那种经典氛围，随手拍都稳\n\n📍适合边逛边拍的\n5. 油罐艺术中心\n建筑线条很干净，晴天阴天都好看\n6. 西郊宾馆\n绿化特别好，像在市区里藏了片小森林\n7. 香奈儿空间\n展陈一直在线，顺路进去看看很值\n8. 上海博物馆东馆\n免费、耐逛、空调足，夏天真的友好\n\n📍适合周末慢慢晃的\n9. 徐家汇教堂\n红砖和树影很上镜，傍晚尤其好看\n10. 外滩\n经典归经典，但每次去还是会停下来多看两眼\n11. 张园\n新旧建筑混在一起，逛街拍照都很合适\n12. 李窑村\n人不多，节奏慢，很像在市区里短暂出逃\n\n一句话总结：在上海，很多真正会让人想二刷的地方，刚好都免费。", "images": [{"url": "./assets/0727/01.jpg（世博文化公园）", "caption": ""}, {"url": "./assets/0727/02.jpg（宝山滨江公园）", "caption": ""}, {"url": "./assets/0727/03.jpg（北外滩）", "caption": ""}, {"url": "./assets/0727/04.jpg（外白渡桥）", "caption": ""}, {"url": "./assets/0727/05.jpg（油罐艺术中心）", "caption": ""}, {"url": "./assets/0727/06.jpg（西郊宾馆）", "caption": ""}, {"url": "./assets/0727/07.jpg（香奈儿空间）", "caption": ""}, {"url": "./assets/0727/08.jpg（上海博物馆东馆）", "caption": ""}, {"url": "./assets/0727/09.jpg（徐家汇教堂）", "caption": ""}, {"url": "./assets/0727/10.jpg（外滩）", "caption": ""}, {"url": "./assets/0727/11.jpg（张园）", "caption": ""}, {"url": "./assets/0727/12.jpg（李窑村）", "caption": ""}], "meta": {}}, {"id": "0726", "date": "2026.07.26", "title": "上海12个免费去处合集", "tags": ["周末去哪儿", "上海攻略", "上海旅行", "上海citywalk", "上海免费景点", "爱上海的十万个理由", "上海拍照", "周末去哪玩"], "status": "待发布", "sourceUrl": "", "contentType": "", "body": "常常会被上海的公共资源打动，周末根本不用花大钱，也能把一天过得很充实。\n\n这次整理了12个我会反复去的免费地方，适合一个人闲逛，也适合约闺蜜慢慢走，路线松弛、拍照也出片👇\n\n📍适合散步放空\n1. 世博文化公园\n大草坪和温室区都很舒服，傍晚去最松弛\n2. 宝山滨江公园\n江边风很大，适合发呆看船\n3. 北外滩\n白天看江景，晚上看城市天际线，怎么拍都稳\n4. 外白渡桥\n经典机位，随手一拍就是老上海氛围\n\n📍适合边逛边拍\n5. 油罐艺术中心\n建筑线条很干净，晴天阴天都能拍\n6. 西郊宾馆\n绿化太好，像在市区里偷偷躲进森林\n7. 香奈儿空间\n展陈一直在线，适合顺路进去看一眼\n8. 上海博物馆东馆\n免费又耐逛，空调足，雨天也不怕\n\n📍适合周末慢慢晃\n9. 徐家汇教堂\n红砖真的很上镜，傍晚光线最好看\n10. 外滩\n经典但不会过时，走几次都还是会停下来拍\n11. 张园\n新旧建筑混在一起，逛街拍照都合适\n12. 李窑村\n人少、松弛，还有点像短暂逃离市区\n\n一句话总结：上海好看的地方，很多真的都免费。", "images": [{"url": "https://cdn-image.bj.bcebos.com/uploads/2026/07/26/69a735e1d6234121a287ac2b39e2ed21_720p.webp（世博文化公园）", "caption": ""}, {"url": "https://cdn-image.bj.bcebos.com/uploads/2026/07/26/b377f0e942cd42e7bd8d4cd4d4cd66eb_720p.webp（宝山滨江公园）", "caption": ""}, {"url": "https://cdn-image.bj.bcebos.com/uploads/2026/07/26/38666b13d6ab4c5aa0ebf42ec4e36886_720p.webp（北外滩）", "caption": ""}, {"url": "https://cdn-image.bj.bcebos.com/uploads/2026/07/26/6163e8c8a13141b6bfb5e2142d9249be_720p.webp（外白渡桥）", "caption": ""}, {"url": "https://cdn-image.bj.bcebos.com/uploads/2026/07/26/8c9f4fe0bbb24187832614be49857052_720p.webp（油罐艺术中心）", "caption": ""}, {"url": "https://cdn-image.bj.bcebos.com/uploads/2026/07/26/cb1af1ec9acc4657a1af0354931c93c2_720p.webp（西郊宾馆）", "caption": ""}, {"url": "https://cdn-image.bj.bcebos.com/uploads/2026/07/26/76ac05cc71634f25ba8fcb5927a8ab92_720p.webp（香奈儿空间）", "caption": ""}, {"url": "https://cdn-image.bj.bcebos.com/uploads/2026/07/26/09406ff6583746cfa51087be5acbd0e4_720p.webp（上海博物馆东馆）", "caption": ""}], "meta": {}}, {"id": "0724", "date": "2026.07.24", "title": "上海不花钱遛娃｜11个免费室内宝地", "tags": ["周末去哪儿", "上海遛娃好去处", "上海免费景点", "citywalk", "室内遛娃", "免费遛娃", "暑假遛娃", "上海打卡"], "status": "待发布", "sourceUrl": "", "contentType": "", "body": "三伏天怕中暑？暴雨天没法出门？借了闺蜜的娃，上海这些免费室内场馆简直是救命稻草🫧\n\n整理了11个地方，博物馆+运动+交通工具全都有，周末直接抄👇\n\n📍博物馆篇\n①奉贤规划馆\n海洋球池+霍比特小屋+积木墙，娃进去就拉不出来\n②上海博物馆东馆\n数字馆沉浸式山水画，探索馆变身小小考古学家\n③新闻出版博物馆\n童声八音盒+端午五彩粽+娃衣DIY，互动项目超多\n④航宇科普中心\n退役真飞机+模拟机舱操作台（儿童免票成人8元）\n⑤中华艺术宫\n暑假都有高质量艺术互动展，小朋友艺术启蒙好去处\n⑥儿童博物馆\n专门为小朋友设计，互动性很强\n\n📍运动阅读篇\n⑦田林街道市民健身中心\n攀爬吊环+篮球+乒乓球，放电绝了\n⑧浦东规划馆\n城市规划展示+城市模型，大一点的小朋友更感兴趣\n⑨少年儿童图书馆\n阅读空间宽敞，泡一下午没问题\n\n🚏交通工具彩蛋\n⑩三港线轮渡\n连接西岸和前滩，人少！两岸风景一次看够\n⑪浦江线\n无人驾驶轻轨，坐第一节看窗景，小朋友兴奋到尖叫\n\n全部0元（航宇成人8块）暑假直接抄作业！", "images": [{"url": "https://cdn-image.bj.bcebos.com/uploads/2026/07/24/3afbcdba047146b79b2494b078aaee0e.png（奉贤规划馆·彩色纽扣隧道）", "caption": ""}, {"url": "https://cdn-image.bj.bcebos.com/uploads/2026/07/24/acae79a94b83478f92266bb03c158179.png（上博东馆·数字山水画沉浸展厅）", "caption": ""}, {"url": "https://cdn-image.bj.bcebos.com/uploads/2026/07/24/5bf1a63224794e88a2c10acfa4ac7c21.png（航宇科普中心·模拟机舱体验）", "caption": ""}, {"url": "https://cdn-image.bj.bcebos.com/uploads/2026/07/24/68d60b0a692a4c6ab9462a310f400586.png（中华艺术宫·插画展厅）", "caption": ""}, {"url": "https://cdn-image.bj.bcebos.com/uploads/2026/07/24/1433c71d0d6b4afb87a4137b8177e7d2.png（三港线轮渡·两岸江景）", "caption": ""}, {"url": "https://cdn-image.bj.bcebos.com/uploads/2026/07/24/b5b476a128874cffa20620d4fc0938c3.png（浦江线·无人驾驶轻轨窗景）", "caption": ""}], "meta": {}}, {"id": "0723", "date": "2026.07.23", "title": "杭州三天两晚｜不绕路逛吃攻略", "tags": ["周末去哪儿", "旅游攻略", "杭州旅游", "小众旅行地", "周末去哪玩", "杭州攻略", "暑假旅行", "江浙沪周边游"], "status": "已发布", "sourceUrl": "", "contentType": "", "body": "打工人的暑假救赎就是逃去杭州吸氧🌿\n高铁半小时到，三天两晚不绕路，抄作业就完事👇\n\nDay1⃣ 西湖一条龙\n断桥残雪租个自行车→沿白堤慢慢骑到孤山→苏堤走一截→曲院风荷看荷花→三潭印月坐船→雷峰塔拍个远景→太子湾草坪躺平发呆\n⚠骑行比走路省一半时间，断桥出发顺时针走不回头\n\nDay2⃣ 寺庙老街\n黄龙体育中心B口坐灵隐专线→飞来峰门票45→灵隐寺香花券30→法喜寺免费初一十五也免→杭州博物馆→南宋御街→河坊街吃逛收尾\n⚠灵隐寺千万别打车！堵到怀疑人生，公交专线7点就有了\n\nDay3⃣ 湿地老街\n中国湿地博物馆（免费！先去）→西溪湿地80元→杭州植物园10元→小河直街簪花拍照→拱宸桥看运河→武林夜市收尾\n\n🍜吃什么\n片儿川必吃，蟹黄面推荐龙翔桥附近那几家\n西湖醋鱼……甜腥口感自行斟酌，个人建议换片儿川\n\n📌住宿\n龙翔桥地铁站附近，人均150交通便利，去哪都不远\n\n避坑就一句话：灵隐寺早去、西湖骑车、醋鱼慎点、船选苏堤到茅家埠300元那条", "images": [{"url": "https://cdn-image.bj.bcebos.com/uploads/2026/07/23/8f22e44f4b4645c2aa7c83016dcd3120.png（封面·杭州三日游路线总览）", "caption": ""}, {"url": "https://cdn-image.bj.bcebos.com/uploads/2026/07/23/91b1d4a28161442cac32832be73bff3d.png（Day1西湖环线行程图）", "caption": ""}, {"url": "https://cdn-image.bj.bcebos.com/uploads/2026/07/23/d1543409a73541b19068bae4e77cb5bd.png（Day2寺庙老街行程图）", "caption": ""}, {"url": "https://cdn-image.bj.bcebos.com/uploads/2026/07/23/b98a4b6f5a4d45fbb30eeb50fb7d8698.png（Day3湿地老街行程图）", "caption": ""}, {"url": "https://cdn-image.bj.bcebos.com/uploads/2026/07/23/018b00730dc44443b8c3f458f9aba862.png（寺庙祈福攻略信息卡）", "caption": ""}, {"url": "https://cdn-image.bj.bcebos.com/uploads/2026/07/23/c9f7c57129aa4286ba7fc08d01d750f2.png（杭州美食推荐信息卡）", "caption": ""}, {"url": "https://cdn-image.bj.bcebos.com/uploads/2026/07/23/d959b6fef8454beab94ac8efc2326292.png（避坑指南信息卡）", "caption": ""}, {"url": "https://cdn-image.bj.bcebos.com/uploads/2026/07/23/b16b7d94b15b44e7af1c4862058b8461.png（交通住宿Tips信息卡）", "caption": ""}], "meta": {"发布链接": "https://www.xiaohongshu.com/discovery/item/6a634822000000000f03e19a", "发布时间": "2026-07-24 19:10", "赞藏评": "赞0 藏0 评0 分享0（2026.08.27 更新）"}}, {"id": "0722", "date": "2026.07.22", "title": "上海巨富长｜3km逛吃逛玩攻略", "tags": ["上海citywalk", "周末去哪儿", "上海探店", "逛吃全攻略", "巨富长", "城市慢慢游", "上海旅行", "周末去哪玩"], "status": "待发布", "sourceUrl": "", "contentType": "", "body": "打工人周末想逛梧桐区又不想太累？巨富长这条3km真的刚刚好🌿\n\n常熟路站8口出来，沿延庆路华亭路慢慢晃到长乐路，一路梧桐老洋房，走在路上就够治愈了。全程3km，慢慢逛3-4小时，逛吃买一站搞定👇\n\n🛍逛买篇\nGoodBai在延庆路上，白敬亭的潮牌+咖啡，路过打卡\nHare Artis手作器具可爱到想全部搬回家\nMelo Mela韩系小杂货，DIY挂件适合闺蜜一起\nBadmarket衣服+小杂物逛起来很上头\nfRUITYSHOP黑胶唱片店氛围感拉满\nHitable日系侘寂风餐具性价比意外高\n又喜商店少女心饰品进去了出不来\n木木手帐屋在手帐圈子里很有名\nD.ice配饰小众不撞款\nBASEMENT FG三层洋房潮牌店门口Hello Kitty列车太出片\n\n🍜吃饭篇\n旬福食堂咖喱饭分量足，逛累了回血\n叁店黑金卤肉饭+盐酥鸡台式快乐\n野果与山椒贵州菜酸辣开胃\nPlusone咖啡店超chill坐一下午不想走\n尼泊尔餐厅异域风味换换口味\n\n📸必拍\n新乐路老洋房门头+金黄梧桐秋天去绝了\n作家书店在洋房二楼周二休息别跑空\n\n📌Tips\n常熟路站8口进陕西南路站2口出不走回头路\n周末下午人多想拍照建议上午去", "images": [{"url": "https://cdn-image.bj.bcebos.com/uploads/2026/07/22/3a75cdaabb5648028a02a584ebba056f.png（封面·巨富长路线概览）", "caption": ""}, {"url": "https://cdn-image.bj.bcebos.com/uploads/2026/07/22/278ea0d4835e424d89729ca6fc17a739.png（手绘路线图）", "caption": ""}, {"url": "https://cdn-image.bj.bcebos.com/uploads/2026/07/22/b835d7e127af499c913205703e953889.png（梧桐区街景）", "caption": ""}, {"url": "https://cdn-image.bj.bcebos.com/uploads/2026/07/22/9af06c0e0c5e4f208e52c2862a67608e.png（手作小店内景）", "caption": ""}, {"url": "https://cdn-image.bj.bcebos.com/uploads/2026/07/22/948b4db5f7a742d3bb0a50abff53f6de.png（韩系杂货铺）", "caption": ""}, {"url": "https://cdn-image.bj.bcebos.com/uploads/2026/07/22/2f28a82f5d41458999aee0d340465a5c.png（旬福食堂咖喱饭）", "caption": ""}, {"url": "https://cdn-image.bj.bcebos.com/uploads/2026/07/22/2bdc1a41bdcf44c89fb904d276e3b601.png（洋房书店）", "caption": ""}, {"url": "https://cdn-image.bj.bcebos.com/uploads/2026/07/22/aed0b43347dc49299ba17cfda739fbe6.png（BASEMENT", "caption": ""}], "meta": {}}, {"id": "0721", "date": "2026.07.21", "title": "上海2h逃岛｜花鸟岛枸杞岛攻略", "tags": ["周末去哪儿", "旅游攻略", "小众旅行地", "周末去哪玩", "上海周边游", "海岛度假", "我的宝藏小众岛屿", "江浙沪周边游"], "status": "已发布", "sourceUrl": "", "contentType": "", "body": "打工人夏天最想干的事，就是逃到海岛吹海风🌊\n\n上海南浦大桥坐车船联票，大巴+船约3.5h到花鸟岛，《国家地理》都点名的宝藏岛。刚回来，整理给打工人抄作业👇\n\n📅Day1 花鸟岛\n上岛放行李→慢邮局寄明信片给未来的自己→花鸟灯塔蹲日落（观光车20/人，橘色余晖洒白塔上绝了）→南岙沙滩碰运气看蓝眼泪（7-8月概率高）\n住花鸟村，靠码头出行方便，很多民宿能看海\n\n📅Day2 花鸟岛→枸杞岛\n早起佛手石看日出→乘船1h到枸杞岛→山海奇观俯瞰海上牧场（免费！日落绝美）→大王沙滩玩水踩沙→海鲜排档晚餐吹海风\n\n📅Day3 枸杞岛\n东崖绝壁看中国最东日出，悬崖直面太平洋真的震撼→无人村探秘，废弃房屋爬满爬山虎，像绿野仙踪，无人机拍全景超绝\n\n🚢交通Tips\n✅上海南浦大桥买车船联票\n✅花鸟岛→枸杞岛旺季船票紧张，务必提前订！民宿老板能帮忙\n✅大风大雾船班可能取消，关注天气\n\n📸必打卡：慢邮局、花鸟灯塔、佛手石、东崖绝壁、无人村、山海奇观、大王沙滩\n\n⚠防蚊防晒拉满，岛上海风紫外线不是闹的", "images": [{"url": "https://cdn-image.bj.bcebos.com/uploads/2026/07/21/29a68e741de44ba7a5dbfcebf57fbe50.png（花鸟岛全景·封面）", "caption": ""}, {"url": "https://cdn-image.bj.bcebos.com/uploads/2026/07/21/3825042c45514d66afbb8818669cca53.png（花鸟灯塔日落）", "caption": ""}, {"url": "https://cdn-image.bj.bcebos.com/uploads/2026/07/21/e625ee4f1a954dc1954d409b23b089cb.png（大王沙滩）", "caption": ""}, {"url": "https://cdn-image.bj.bcebos.com/uploads/2026/07/21/33886269949b4f2d8028a96caad6445c.png（东崖绝壁日出）", "caption": ""}, {"url": "https://cdn-image.bj.bcebos.com/uploads/2026/07/21/1db48ae35a604b6dbe11e07a794205bc.png（无人村绿野仙踪）", "caption": ""}, {"url": "https://cdn-image.bj.bcebos.com/uploads/2026/07/21/d43e5efc766c4632872006a647e1c9fd.png（枸杞岛渔村全景）", "caption": ""}] const VIEWS=[['overview','✨ 概览'],['materials','📕 笔记素材库'],['candidates','📊 候选列表'],['tracker','📈 数据追踪'],['vault','🔥 爆文库']];
const nav=document.getElementById('nav');
VIEWS.forEach(([id,label],i)=>{
  const b=document.createElement('button');b.textContent=label;if(i===0)b.classList.add('on');
  b.onclick=()=>{document.querySelectorAll('nav button').forEach(x=>x.classList.remove('on'));b.classList.add('on');
    document.querySelectorAll('.view').forEach(v=>v.classList.remove('on'));document.getElementById('v-'+id).classList.add('on');window.scrollTo(0,0);};
  nav.appendChild(b);
});
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>{n=Number(n);return isNaN(n)?esc(n):n.toLocaleString();};
// stats

  .map(([l,n])=>`<div class="stat"><div class="n">${n}</div><div class="l">${l}</div></div>`).join('');
function card(m){
  return `<div class="card" onclick='openMaterial(${JSON.stringify(m.id)})'>
    <div class="d">${esc(m.date)} · ${esc(m.contentType||'未分类')}<span class="badge b-${m.status}">${m.status}</span></div>
    <h3>${esc(m.title)}</h3><div class="p">${esc(m.body.slice(0,160))}</div>
    <div>${(m.tags||[]).slice(0,4).map(t=>`<span class="tag">#${esc(t)}</span>`).join('')}</div></div>`;
}
document.getElementById('recent').innerHTML=DATA.materials.slice(0,6).map(card).join('')||'<p>暂无素材</p>';
// materials + filters
let mfilter='全部';
function renderM(){
  const list=DATA.materials.filter(m=>mfilter==='全部'||m.status===mfilter);
  document.getElementById('mcards').innerHTML=list.map(card).join('')||'<p>没有该状态的素材</p>';
}
const mf=document.getElementById('mfilters');
['全部','待发布','已发布','已跳过'].forEach((f,i)=>{
  const b=document.createElement('button');b.textContent=f;if(i===0)b.classList.add('on');
  b.onclick=()=>{mfilter=f;mf.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');renderM();};
  mf.appendChild(b);
});
renderM();
window.openMaterial=id=>{
  const m=DATA.materials.find(x=>x.id===id);if(!m)return;
  const meta=Object.entries(m.meta||{}).map(([k,v])=>`<div>- ${esc(k)}：${esc(v)}</div>`).join('');
  document.getElementById('modal').innerHTML=
    `<button class="close" onclick="document.getElementById('mbg').classList.remove('on')">关闭</button>
     <h2>${esc(m.title)}</h2>
     <div class="d" style="font-size:.78rem;color:#888">${esc(m.date)} · ${esc(m.contentType||'')} <span class="badge b-${m.status}">${m.status}</span></div>
     <div>${(m.tags||[]).map(t=>`<span class="tag">#${esc(t)}</span>`).join('')}</div>
     <div class="body">${esc(m.body)}</div>
     ${m.images.length?'<div class="imgs">'+m.images.map(im=>{const u=im.url.replace(/^\.\//,'');return `<img src="${esc(u)}" loading="lazy" alt="${esc(im.caption)}" onerror="this.outerHTML='<div style=&quot;font-size:.78rem;color:#888&quot;>🖼 ${esc(im.url)}${im.caption?'（'+esc(im.caption)+'）':''}</div>'">`}).join('')+'</div>':''}
     ${m.sourceUrl?`<div style="font-size:.8rem;margin-top:8px">源笔记：<a href="${esc(m.sourceUrl)}" target="_blank">${esc(m.sourceUrl)}</a></div>`:''}
     ${meta?`<div class="meta">${meta}</div>`:''}`;
  document.getElementById('mbg').classList.add('on');
};

document.getElementById('cbatches').innerHTML=DATA.candidates.map(c=>{

    <td>${esc(n.rank)}${n.selected?' ✅':''}</td><td style="max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(n.title)}</td>

    <td>${n.url?`<a href="${esc(n.url)}" target="_blank">查看</a>`:''}</td></tr>`).join('');
  return `<div class="batch"><h3>${esc(c.date)}</h3>
    <div class="kw">${(c.keywords||[]).map(k=>`<span class="tag">${esc(k)}</span>`).join('')} ${facts?'　'+facts:''}</div>
