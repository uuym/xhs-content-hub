<title>大越越的小红书素材库</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --accent:#e83149;--accent-light:#fce8eb;
  --bg:#f8f9fa;--card:#fff;--text:#1a1a1a;--gray:#6c757d;
  --gray-light:#f1f3f5;--border:#e9ecef;--green:#07c160;
  --orange:#ff9500;--radius:10px;--shadow:0 2px 8px rgba(0,0,0,0.04);
  --sidebar-w:220px;
}
body{font-family:-apple-system,"PingFang SC","Helvetica Neue",sans-serif;background:var(--bg);color:var(--text);display:flex}

/* Sidebar - white */
.sidebar{width:var(--sidebar-w);background:#fff;border-right:1px solid var(--border);position:fixed;top:0;left:0;height:100vh;display:flex;flex-direction:column;z-index:100}
.sidebar-header{padding:20px 16px;border-bottom:1px solid var(--border)}
.sidebar-header h1{font-size:0.9rem;font-weight:600;color:var(--text)}
.sidebar-header p{font-size:0.7rem;color:var(--gray);margin-top:3px}
.sidebar-nav{flex:1;padding:12px 10px}
.nav-item{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:8px;cursor:pointer;font-size:0.85rem;color:var(--gray);transition:all 0.15s;margin-bottom:2px}
.nav-item:hover{background:var(--gray-light);color:var(--text)}
.nav-item.active{background:var(--accent);color:#fff;font-weight:500}
.nav-item-icon{font-size:1rem}
.sidebar-stats{padding:14px 16px;border-top:1px solid var(--border)}
.sidebar-stat{display:flex;justify-content:space-between;font-size:0.75rem;color:var(--gray);margin-bottom:6px}
.sidebar-stat span:last-child{font-weight:600;color:var(--text)}

.main{margin-left:var(--sidebar-w);flex:1;padding:28px 36px;min-height:100vh}
.view{display:none}.view.active{display:block}

.sub-tabs{display:flex;gap:6px;margin-bottom:20px}
.sub-tab{padding:5px 14px;border:1px solid var(--border);background:#fff;border-radius:20px;cursor:pointer;font-size:0.8rem;color:var(--gray)}
.sub-tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}

/* Card Grid - all same height */
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
.card-wrapper{position:relative}
.card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;cursor:pointer;transition:transform 0.2s,box-shadow 0.2s;height:420px;display:flex;flex-direction:column}
.card:hover{transform:translateY(-3px);box-shadow:0 6px 16px rgba(0,0,0,0.08)}
.card-img{width:100%;aspect-ratio:3/4;object-fit:cover;background:var(--gray-light);display:block;flex-shrink:0;max-height:280px}
.card-body{padding:8px 10px;flex:1;display:flex;flex-direction:column;overflow:hidden}
.card-date{font-size:0.6rem;color:var(--accent);background:var(--accent-light);padding:1px 6px;border-radius:6px;display:inline-block;margin-bottom:4px;align-self:flex-start}
.card-title{font-size:0.75rem;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:4px}
.card-tags{display:flex;flex-wrap:wrap;gap:3px;margin-top:auto}
.card-tag{font-size:0.55rem;color:var(--gray);background:var(--gray-light);padding:1px 5px;border-radius:4px}
.card-status{position:absolute;top:6px;right:6px;font-size:0.55rem;padding:2px 6px;border-radius:6px;color:#fff}
.status-draft{background:var(--orange)}.status-published{background:var(--green)}.status-skipped{background:var(--gray)}

/* Candidate */
.candidate-card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:20px}
.candidate-header{padding:14px 18px;border-bottom:1px solid var(--border)}
.candidate-date{font-size:0.75rem;color:var(--accent);background:var(--accent-light);padding:3px 10px;border-radius:8px}
.candidate-info{margin:8px 0 4px;font-size:0.82rem}.candidate-info b{color:var(--accent)}
.candidate-summary{font-size:0.82rem;color:var(--gray)}.candidate-summary b{color:var(--text)}
.candidate-body{padding:14px 18px;overflow-x:auto}
.candidate-table{width:100%;font-size:0.82rem;border-collapse:collapse}
.candidate-table th{text-align:left;padding:8px 10px;background:var(--gray-light);color:var(--gray);font-weight:500;white-space:nowrap}
.candidate-table td{padding:8px 10px;border-bottom:1px solid var(--border)}
.candidate-table a{color:var(--accent);text-decoration:none}
.candidate-selected{background:var(--accent-light)}
.candidate-logic{margin-top:12px;padding:10px 14px;background:var(--gray-light);border-radius:8px;font-size:0.82rem;line-height:1.6}
.candidate-logic b{color:var(--accent)}

/* Tracker */
.tracker{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.tracker-table{width:100%;border-collapse:collapse;font-size:0.82rem}
.tracker-table th{text-align:left;padding:10px 14px;background:var(--gray-light);color:var(--gray);font-weight:500}
.tracker-table td{padding:10px 14px;border-bottom:1px solid var(--border)}
.tracker-table tr:hover{background:var(--gray-light)}
.badge{font-size:0.65rem;padding:2px 8px;border-radius:6px;color:#fff}

/* Modal */
.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:200;display:none;justify-content:center;align-items:flex-start;padding:40px 20px;overflow-y:auto}
.modal-overlay.active{display:flex}
.modal{background:#fff;border-radius:16px;max-width:820px;width:100%;overflow:hidden;margin-bottom:40px}
.modal-header{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.modal-close{background:none;border:none;font-size:1.3rem;cursor:pointer;color:var(--gray);padding:4px 8px}
.modal-body{padding:16px 22px}
.modal-title{font-size:1.1rem;font-weight:600;margin-bottom:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.modal-content{font-size:0.9rem;line-height:1.58;white-space:pre-wrap;margin-bottom:10px}
.modal-tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px}
.modal-tag{font-size:0.75rem;color:var(--accent);background:var(--accent-light);padding:3px 9px;border-radius:10px}
.modal-images{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:12px}
.modal-images img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:6px;cursor:pointer;transition:transform 0.2s}
.modal-images img:hover{transform:scale(1.05)}

/* Action Bar */
.action-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:14px 22px;background:var(--gray-light);border-top:1px solid var(--border)}
.btn{padding:7px 16px;border-radius:8px;border:none;font-size:0.85rem;cursor:pointer;font-weight:500}
.btn:hover{opacity:0.85}
.btn-publish{background:var(--green);color:#fff}
.btn-skip{background:var(--gray);color:#fff}
.btn-link{background:var(--accent);color:#fff}
.btn-copy-small{padding:4px 10px;border-radius:7px;border:none;background:#333;color:#fff;font-size:0.72rem;cursor:pointer;font-weight:500}
.btn-download{background:#333;color:#fff}
.link-input{flex:1;min-width:180px;padding:7px 11px;border:1px solid var(--border);border-radius:8px;font-size:0.85rem}
.reason-input{flex:1;min-width:180px;padding:7px 11px;border:1px solid var(--border);border-radius:8px;font-size:0.85px}
.reason-section{margin-top:10px}
.reason-label{font-size:0.8rem;color:var(--gray);margin-bottom:4px}

.empty{text-align:center;padding:50px 20px;color:var(--gray)}

@media(max-width:768px){
  .sidebar{width:56px}
  .sidebar-header h1,.sidebar-header p,.sidebar-stats,.nav-item span:not(.nav-item-icon){display:none}
  .main{margin-left:56px;padding:20px 16px}
  .modal-images{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>

{id:"0721",date:"2026.07.21",status:"published",publishedAt:"2026-07-21 12:49:26",link:"https://www.xiaohongshu.com/discovery/item/6a5efa56000000000e0374d7",metrics:{likes:11,saves:7,comments:2,shares:4,updatedAt:"2026-07-24 12:18"},title:"上海2h逃岛｜花鸟岛枸杞岛攻略",body:`打工人夏天最想干的事，就是逃到海岛吹海风🌊\n\n上海南浦大桥坐车船联票，大巴+船约3.5h到花鸟岛，《国家地理》都点名的宝藏岛。刚回来，整理给打工人抄作业👇\n\n📅Day1 花鸟岛\n上岛放行李→慢邮局寄明信片给未来的自己→花鸟灯塔蹲日落（观光车20/人，橘色余晖洒白塔上绝了）→南岙沙滩碰运气看蓝眼泪（7-8月概率高）\n住花鸟村，靠码头出行方便，很多民宿能看海\n\n📅Day2 花鸟岛→枸杞岛\n早起佛手石看日出→乘船1h到枸杞岛→山海奇观俯瞰海上牧场（免费！日落绝美）→大王沙滩玩水踩沙→海鲜排档晚餐吹海风\n\n📅Day3 枸杞岛\n东崖绝壁看中国最东日出，悬崖直面太平洋真的震撼→无人村探秘，废弃房屋爬满爬山虎，像绿野仙踪，无人机拍全景超绝\n\n🚢交通Tips\n✅上海南浦大桥买车船联票\n✅花鸟岛→枸杞岛旺季船票紧张，务必提前订！民宿老板能帮忙\n✅大风大雾船班可能取消，关注天气\n\n📸必打卡：慢邮局、花鸟灯塔、佛手石、东崖绝壁、无人村、山海奇观、大王沙滩\n\n⚠️防蚊防晒拉满，岛上海风紫外线不是闹的`,tags:["#周末去哪儿","#旅游攻略","#小众旅行地","#周末去哪玩","#上海周边游","#海岛度假","#我的宝藏小众岛屿","#江浙沪周边游"],images:["https://cdn-image.bj.bcebos.com/uploads/2026/07/21/29a68e741de44ba7a5dbfcebf57fbe50.png","https://cdn-image.bj.bcebos.com/uploads/2026/07/21/3825042c45514d66afbb8818669cca53.png","https://cdn-image.bj.bcebos.com/uploads/2026/07/21/e625ee4f1a954dc1954d409b23b089cb.png","https://cdn-image.bj.bcebos.com/uploads/2026/07/21/33886269949b4f2d8028a96caad6445c.png","https://cdn-image.bj.bcebos.com/uploads/2026/07/21/1db48ae35a604b6dbe11e07a794205bc.png","https://cdn-image.bj.bcebos.com/uploads/2026/07/21/d43e5efc766c4632872006a647e1c9fd.png"],imgCaptions:["花鸟岛全景·封面","花鸟灯塔日落","大王沙滩","东崖绝壁日出","无人村绿野仙踪","枸杞岛渔村全景"]},
{id:"0720",date:"2026.07.20",status:"published",publishedAt:"2026-07-20 15:44:08",link:"https://www.xiaohongshu.com/discovery/item/6a5dd1c8000000001d021507?app_platform=ios&app_version=9.32.3&share_from_user_hidden=true&xsec_source=app_share&type=normal&xsec_token=CBszt8ThM8uwlyoeUK4-8_C99ESdppaUMR1U2BMSRcxkY=&author_share=1",metrics:{likes:66,saves:97,comments:2,shares:24,updatedAt:"2026-07-24 12:18"},title:"上海这9个地方去了会上头",body:`终于攒够了上海9个宝藏地📍打工人周末就该去这些地方\n\n不是热门打卡点那种，是真的去了会反复想念的那种。\n\n🏠古董花园\n老洋房里的独立咖啡馆，夏天午后一个人坐窗边发呆，时间都慢下来了。满墙旧书和复古绒面椅，连空气都是慵懒的。P1-3\n\n🌿hachi\n梧桐叶铺满整面窗框，秋天去绝了。坐一下午，班味都散了。P4-5\n\n🏛夏衍故居\n上海好看的地方真的不要钱！安静人少，放空圣地。P6\n\n🥖folder\n在街边吃法棍的那一秒，恍惚以为自己在巴黎。路过必进。P7\n\n🏺for long\n古器物空间+好吃马卡龙，审美在线到离谱。约闺蜜去最合适。P8-9\n\n🚪Deep Valley\n需提前预约！但进去就知道值，审美真的绝。P10\n\n☕1691 & CJC\n白天咖啡晚上酒，打工人的快乐老家没跑了。氛围感拿捏死死的。P11-12\n\n🌳何东旧居\n大树从楼里穿出来，满眼绿色，站在底下抬头看的时候真的会被震到。P13-14\n\n📷小乔治\n学校附近的田园咖啡馆，随便拍都出片。P15-16\n\n🍡Sabi 805\n日系小店，甜品饮品风味都很独特，值得专程跑一趟。P17`,tags:["#上海citywalk","#上海","#上海探店","#周末去哪儿","#上海旅行","#爱上海的十万个理由"],images:["https://cdn-image.bj.bcebos.com/uploads/2026/07/20/5a3f4882f5ab4710a3ca481a24fc2b42.png","https://cdn-image.bj.bcebos.com/uploads/2026/07/20/d25277b2523b4346adf7f1b4402d95f1.png","https://cdn-image.bj.bcebos.com/uploads/2026/07/20/2dd2e49131a14ae0a6f986954d8dea41.png","https://cdn-image.bj.bcebos.com/uploads/2026/07/20/266b3c85fe5a4c95b50c6493c725dd50.png","https://cdn-image.bj.bcebos.com/uploads/2026/07/20/8e839508244c4328a38520f4033f3573.png","https://cdn-image.bj.bcebos.com/uploads/2026/07/20/06015e0982c345bc95539accb3367a8f.png","https://cdn-image.bj.bcebos.com/uploads/2026/07/20/6b0271bc20f6435a8f968239f326b9a0.png","https://cdn-image.bj.bcebos.com/uploads/2026/07/20/c7b03314086f49e7aebfc3ffa6072e17.png","https://cdn-image.bj.bcebos.com/uploads/2026/07/20/cd11d5e99d1c428ba3d5e62315bd259a.png","https://cdn-image.bj.bcebos.com/uploads/2026/07/20/d90a87332b75480195672c76befb5c65.png","https://cdn-image.bj.bcebos.com/uploads/2026/07/20/1503de8fe9ef444882c3e8b45d9deef1.png","https://cdn-image.bj.bcebos.com/uploads/2026/07/20/7ecdb1ecedbc43439b3b37acbfb3e80b.png","https://cdn-image.bj.bcebos.com/uploads/2026/07/20/ba9efcd0b4eb4d76aa8f38152a510672.png","https://cdn-image.bj.bcebos.com/uploads/2026/07/20/a5d7e25d62fb40c6960f6e6e18a10a9d.png","https://cdn-image.bj.bcebos.com/uploads/2026/07/20/54828a13e9604e22ab319a614cff2f7a.png","https://cdn-image.bj.bcebos.com/uploads/2026/07/20/033fbfb472b34e31aa6eb4ccb4a290b0.png","https://cdn-image.bj.bcebos.com/uploads/2026/07/20/1838243d79b84dcaa7388122d1dac95d.png"],imgCaptions:["古董花园封面","古董花园内景","古董花园角落","hachi餐食","hachi窗外","夏衍故居","folder复古静物","for long极简室内","for long古器物","Deep Valley","1691&CJC窗边","1691&CJC夜间","何东旧居内景","何东旧居大树","小乔治洋房","小乔治内景","Sabi 805"]},
{id:"0723",date:"2026.07.23",title:"杭州三天两晚｜不绕路逛吃攻略",body:`打工人的暑假救赎就是逃去杭州吸氧🌿
高铁半小时到，三天两晚不绕路，抄作业就完事👇

Day1️⃣ 西湖一条龙
断桥残雪租个自行车→沿白堤慢慢骑到孤山→苏堤走一截→曲院风荷看荷花→三潭印月坐船→雷峰塔拍个远景→太子湾草坪躺平发呆
⚠️骑行比走路省一半时间，断桥出发顺时针走不回头

Day2️⃣ 寺庙老街
黄龙体育中心B口坐灵隐专线→飞来峰门票45→灵隐寺香花券30→法喜寺免费初一十五也免→杭州博物馆→南宋御街→河坊街吃逛收尾
⚠️灵隐寺千万别打车！堵到怀疑人生，公交专线7点就有了

Day3️⃣ 湿地老街
中国湿地博物馆（免费！先去）→西溪湿地80元→杭州植物园10元→小河直街簪花拍照→拱宸桥看运河→武林夜市收尾

🍜吃什么
片儿川必吃，蟹黄面推荐龙翔桥附近那几家
西湖醋鱼……甜腥口感自行斟酌，个人建议换片儿川

📌住宿
龙翔桥地铁站附近，人均150交通便利，去哪都不远

避坑就一句话：灵隐寺早去、西湖骑车、醋鱼慎点、船选苏堤到茅家埠300元那条`,tags:["#周末去哪儿","#旅游攻略","#杭州旅游","#小众旅行地","#周末去哪玩","#杭州攻略","#暑假旅行","#江浙沪周边游"],images:["https://cdn-image.bj.bcebos.com/uploads/2026/07/23/8f22e44f4b4645c2aa7c83016dcd3120.png","https://cdn-image.bj.bcebos.com/uploads/2026/07/23/91b1d4a28161442cac32832be73bff3d.png","https://cdn-image.bj.bcebos.com/uploads/2026/07/23/d1543409a73541b19068bae4e77cb5bd.png","https://cdn-image.bj.bcebos.com/uploads/2026/07/23/b98a4b6f5a4d45fbb30eeb50fb7d8698.png","https://cdn-image.bj.bcebos.com/uploads/2026/07/23/018b00730dc44443b8c3f458f9aba862.png","https://cdn-image.bj.bcebos.com/uploads/2026/07/23/c9f7c57129aa4286ba7fc08d01d750f2.png","https://cdn-image.bj.bcebos.com/uploads/2026/07/23/d959b6fef8454beab94ac8efc2326292.png","https://cdn-image.bj.bcebos.com/uploads/2026/07/23/b16b7d94b15b44e7af1c4862058b8461.png"],imgCaptions:["封面·杭州三日游路线总览","Day1西湖环线行程图","Day2寺庙老街行程图","Day3湿地老街行程图","寺庙祈福攻略信息卡","杭州美食推荐信息卡","避坑指南信息卡","交通住宿Tips信息卡"]},

// State with reason
function loadState(){try{return JSON.parse(localStorage.getItem('xhs_state')||'{}')}catch{return{}}}
function saveState(s){localStorage.setItem('xhs_state',JSON.stringify(s))}
function getStatus(id){const s=loadState();const item=contentData.find(d=>d.id===id);return s[id]?.status||item?.status||'draft'}
function getReason(id){const s=loadState();return s[id]?.reason||''}
function getPubLink(id){const s=loadState();const item=contentData.find(d=>d.id===id);return s[id]?.link||item?.link||''}
function setStatusWithReason(id,st,reason){
  const s=loadState();if(!s[id])s[id]={};
  s[id].status=st;if(reason)s[id].reason=reason;saveState(s);
}
function setPubLink(id,lk,reason){
  const s=loadState();if(!s[id])s[id]={};
  s[id].link=lk;if(lk)s[id].status='published';if(reason)s[id].reason=reason;saveState(s);
}

function switchView(view,el){document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));if(el)el.classList.add('active');document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.getElementById('view-'+view).classList.add('active');if(view==='candidates')renderCandidates();if(view==='tracker')renderTracker()}
let currentFilter='all';
function filterCards(f,el){currentFilter=f;document.querySelectorAll('.sub-tab').forEach(t=>t.classList.remove('active'));if(el)el.classList.add('active');renderCards()}

function renderCards(){const g=document.getElementById('cardGrid');g.innerHTML='';const f=contentData.filter(i=>currentFilter==='all'||getStatus(i.id)===currentFilter);if(!f.length){g.innerHTML='<div class="empty"><p style="font-size:2rem;margin-bottom:8px">📝</p><p>暂无内容</p></div>';return}f.forEach(i=>{const st=getStatus(i.id),img=i.images[0]||'';const b=st==='published'?'<span class="card-status status-published">已发布</span>':st==='skipped'?'<span class="card-status status-skipped">已跳过</span>':'<span class="card-status status-draft">待发布</span>';const c=document.createElement('div');c.className='card-wrapper';c.innerHTML=`${b}<div class="card" onclick="openModal('${i.id}')">${img?`<img class="card-img" src="${img}" loading="lazy">`:'<div class="card-img"></div>'}<div class="card-body"><span class="card-date">${i.date}</span><div class="card-title">${i.title}</div><div class="card-tags">${i.tags.slice(0,3).map(t=>`<span class="card-tag">${t}</span>`).join('')}</div></div></div>`;g.appendChild(c)});updateStats()}
function updateStats(){let d=0,p=0;contentData.forEach(i=>{const s=getStatus(i.id);if(s==='draft')d++;if(s==='published')p++});document.getElementById('cntDraft').textContent=d;document.getElementById('cntPub').textContent=p;document.getElementById('cntTotal').textContent=contentData.length}

function renderCandidates(){const l=document.getElementById('candidateList');l.innerHTML='';candidateData.forEach(c=>{const cd=document.createElement('div');cd.className='candidate-card';cd.innerHTML=`<div class="candidate-header"><span class="candidate-date">${c.date}</span><div class="candidate-info">🔑 搜索词：<b>${c.keywords.join('、')}</b></div><div class="candidate-summary">共搜索 <b>${c.searchCount}</b> 篇 → 初筛通过 <b>${c.filteredCount}</b> 篇 → 最终选稿评分 <b>${c.selectedScore}</b>/100</div></div><div class="candidate-body"><table class="candidate-table"><thead><tr><th>#</th><th>标题</th><th>赞</th><th>藏</th><th>评</th><th>链接</th></tr></thead><tbody>${c.notes.map(n=>`<tr class="${n.selected?'candidate-selected':''}"><td>${n.rank}${n.selected?' ✅':''}</td><td style="max-width:250px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${n.title}</td><td>${n.likes.toLocaleString()}</td><td>${n.saves.toLocaleString()}</td><td>${n.comments}</td><td><a href="${n.url}" target="_blank">查看</a></td></tr>`).join('')}</tbody></table><div class="candidate-logic"><b>选稿逻辑：</b>${c.selectionLogic}</div></div>`;l.appendChild(cd)})}

function renderTracker(){const tb=document.getElementById('trackerBody');tb.innerHTML='';contentData.forEach(i=>{const st=getStatus(i.id),lk=getPubLink(i.id),reason=getReason(i.id),m=i.metrics||{};const bg=st==='published'?'<span class="badge" style="background:var(--green)">已发布</span>':st==='skipped'?'<span class="badge" style="background:var(--gray)">已跳过</span>':'<span class="badge" style="background:var(--orange)">待发布</span>';tb.innerHTML+=`<tr><td>${i.publishedAt||i.date}</td><td style="max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${i.title}</td><td>${bg}</td><td>${lk?`<a href="${lk}" target="_blank" style="color:var(--accent)">查看</a>`:'—'}</td><td>${m.likes??'—'}</td><td>${m.saves??'—'}</td><td>${m.comments??'—'}</td><td>${m.updatedAt||reason||'—'}</td></tr>`})}

function openModal(id){
  const i=contentData.find(d=>d.id===id);if(!i)return;
  const st=getStatus(i.id),lk=getPubLink(i.id),reason=getReason(i.id);

          <button class="btn btn-skip" style="margin-left:auto" onclick="setStatusAndRender('${i.id}','draft')">取消发布</button>
        </div>
        ${lk?`<div style="margin-top:8px"><input class="link-input" id="linkInput-${i.id}" placeholder="发布链接" value="${lk}"><button class="btn btn-link" style="margin-left:6px" onclick="saveLink('${i.id}')">更新链接</button></div>`:''}
      </div>`
    : `<div style="width:100%">
        <div class="reason-label" style="color:var(--gray);margin-bottom:6px">📝 写上发布/不发布理由（用于优化迭代）</div>
        <textarea class="link-input" id="reasonInput-${i.id}" placeholder="如：标题太长/图片风格不搭/内容不够实用..." style="width:100%;min-height:60px;resize:vertical;margin-bottom:10px;font-family:inherit">${reason}</textarea>
        <div style="display:flex;gap:8px">

          <button class="btn btn-skip" onclick="confirmAction('${i.id}','skipped')">⏭️ 跳过不发</button>
          <span style="flex:1"></span>
          ${lk?`<a href="${lk}" target="_blank" style="color:var(--accent);font-size:0.85rem;align-self:center">查看笔记 →</a>`:''}
        </div>
      </div>`;
  document.getElementById('modalContent').innerHTML=`<div class="modal-header"><div><span class="card-date">${i.date}</span><div class="modal-title" style="margin-top:4px"><span>${i.title}</span><button class="btn-copy-small" onclick="copyText('${i.id}')">📋 复制文案</button></div></div><button class="modal-close" onclick="closeModal()">✕</button></div><div class="modal-body"><div class="modal-content">${i.body}</div><div class="modal-tags">${i.tags.map(t=>`<span class="modal-tag">${t}</span>`).join('')}</div>${i.images.length?`<div class="modal-images">${i.images.map((u,idx)=>`<img src="${u}" loading="lazy" alt="${i.imgCaptions[idx]||'图片'+(idx+1)}" onclick="window.open('${u}','_blank')" title="${i.imgCaptions[idx]||'图片'+(idx+1)}">`).join('')}</div>`:'<p style="color:#999;text-align:center;padding:20px">暂无图片</p>'}</div><div class="action-bar"><div style="display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;width:100%"><button class="btn btn-download" onclick="downloadImages('${i.id}')">📥 下载图片(压缩包)</button></div>${actionSection}</div>`;
  document.getElementById('modalOverlay').classList.add('active');
}

function confirmAction(id,st){
  const reason=document.getElementById(`reasonInput-${id}`)?.value||'';
  setStatusWithReason(id,st,reason);
  closeModal();renderCards();renderTracker();
}

function saveLink(id){
  const lk=document.getElementById(`linkInput-${id}`)?.value||'';
  const reason=document.getElementById(`reasonInput-${id}`)?.value||'';
  if(lk){setPubLink(id,lk,reason);closeModal();renderCards();renderTracker();}
}

// Copy title/body/tags with original line breaks
async function copyText(id){
  const item=contentData.find(d=>d.id===id);if(!item)return;
  const text=`${item.title}\n\n${item.body}\n\n${item.tags.join(' ')}`;
  const btn=event.target;
  try{
    await navigator.clipboard.writeText(text);
    const old=btn.textContent;btn.textContent='✅ 已复制';
    setTimeout(()=>btn.textContent=old,1200);
  }catch(e){
    const ta=document.createElement('textarea');
    ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);
    const old=btn.textContent;btn.textContent='✅ 已复制';
    setTimeout(()=>btn.textContent=old,1200);
  }
}

// Download pre-packed zip from same origin
function downloadImages(id){
  const item=contentData.find(d=>d.id===id);if(!item)return;
  const a=document.createElement('a');
  a.href=`./zips/${id}.zip`;
  a.download=`${id}-${item.title.slice(0,10)}.zip`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

function closeModal(){document.getElementById('modalOverlay').classList.remove('active')}
function closeModalOnOverlay(e){if(e.target===document.getElementById('modalOverlay'))closeModal()}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
renderCards();renderTracker();
</script>
</body>
</html>
